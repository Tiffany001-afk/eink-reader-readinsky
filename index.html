        // === TXT 引擎（100% 離線可用） ===
        async function loadTxtContent(text, fileName) {
            cleanupEpub();
            state.mode = 'txt';
            state.currentFile = fileName;
            state.txtContent = text;
            state.txtPage = 0;

            epubViewer.classList.add('hidden');
            txtViewer.classList.remove('hidden');

            txtContent.textContent = text;
            tocList.innerHTML = '<li class="muted-text">TXT 純文字檔無章節目錄</li>';

            applyStyles();

            const saved = await getSavedBookProgress(fileName);
            if (saved && typeof saved.txtPage === 'number' && saved.txtPage >= 0) {
                state.txtPage = saved.txtPage;
            }

            requestAnimationFrame(() => {
                recalculateTxtPagination(true);
                restoreTxtHighlightsInDom();
            });

            renderBookmarks();
            renderHighlightSummary();
            showToast(`已載入：${fileName}`);
        }

        function recalculateTxtPagination(keepCurrentPage = true) {
            if (state.mode !== 'txt') return;

            const viewerWidth = Math.floor(txtViewer.clientWidth) || window.innerWidth;
            if (state.direction === 'vertical') {
                txtViewer.classList.add('vertical-mode');
                txtContent.style.columnWidth = 'auto';
            } else {
                txtViewer.classList.remove('vertical-mode');
                txtContent.style.columnWidth = `${viewerWidth}px`;
            }

            const totalScrollWidth = txtViewer.scrollWidth;
            const totalPages = Math.max(1, Math.ceil(totalScrollWidth / viewerWidth));
            state.txtTotalPages = totalPages;

            if (!keepCurrentPage) {
                state.txtPage = 0;
            } else if (state.txtPage >= totalPages) {
                state.txtPage = totalPages - 1;
            }

            goToTxtPage(state.txtPage);
        }

        function goToTxtPage(pageIndex) {
            if (state.mode !== 'txt') return;
            const viewerWidth = Math.floor(txtViewer.clientWidth) || window.innerWidth;
            const clamped = Math.max(0, Math.min(pageIndex, state.txtTotalPages - 1));
            state.txtPage = clamped;

            if (state.direction === 'vertical') {
                txtViewer.scrollLeft = -(clamped * viewerWidth);
            } else {
                txtViewer.scrollLeft = clamped * viewerWidth;
            }

            pageInfo.textContent = `目前頁數 ${clamped + 1} / 總頁數 ${state.txtTotalPages}`;
        }

        // 還原先前儲存的 TXT 畫線（依文字內容重新標記）
        function restoreTxtHighlightsInDom() {
            if (state.mode !== 'txt') return;
            const list = getBookHighlights().filter(h => h && h.id && h.type === 'txt' && h.text);
            if (list.length === 0) return;

            list.forEach(item => {
                if (txtContent.querySelector(`mark[data-hl-id="${item.id}"]`)) return;
                const walker = document.createTreeWalker(txtContent, NodeFilter.SHOW_TEXT, null);
                let node;
                while ((node = walker.nextNode())) {
                    if (node.parentElement && node.parentElement.tagName === 'MARK') continue;
                    const idx = node.nodeValue.indexOf(item.text);
                    if (idx !== -1) {
                        const range = document.createRange();
                        range.setStart(node, idx);
                        range.setEnd(node, idx + item.text.length);
                        const mark = document.createElement('mark');
                        mark.className = 'highlight-bg';
                        mark.dataset.hlId = item.id;
                        mark.style.backgroundColor = item.color || '#FFFF00';
                        try {
                            range.surroundContents(mark);
                        } catch {}
                        break;
                    }
                }
            });
        }

        // === EPUB 引擎 ===
        async function loadEpub(file) {
            try {
                const buffer = await file.arrayBuffer();
                await loadEpubFromArrayBuffer(buffer, file.name);
            } catch {
                showToast('無法讀取此 EPUB 檔案。');
            }
        }

        async function loadEpubFromArrayBuffer(buffer, fileName) {
            if (!epubEngineReady || typeof window.ePub === 'undefined') {
                showToast('找不到離線 EPUB 引擎，請確認資料夾內已放入 libs/jszip.min.js 與 libs/epub.min.js。', 5000);
                return;
            }

            cleanupEpub();
            const token = currentBookToken;

            state.mode = 'epub';
            state.currentFile = fileName;
            state.epubCfi = null;

            txtViewer.classList.add('hidden');
            epubViewer.classList.remove('hidden');
            pageInfo.textContent = '載入 EPUB 中...';

            try {
                book = window.ePub(buffer);
                await book.ready;
                if (token !== currentBookToken) return;

                if (book.package && book.package.metadata) {
                    book.package.metadata.direction = state.direction === 'vertical' ? 'rtl' : 'ltr';
                }

                book.loaded.navigation.then(nav => {
                    if (token !== currentBookToken) return;
                    renderTOC(nav && nav.toc ? nav.toc : []);
                }).catch(() => {
                    if (token !== currentBookToken) return;
                    tocList.innerHTML = '<li class="muted-text">此書未提供目錄</li>';
                });

                const saved = await getSavedBookProgress(fileName);
                const startCfi = saved && saved.epubCfi ? saved.epubCfi : null;

                initEpubRendition(startCfi);
                renderBookmarks();
                renderHighlightSummary();
                showToast(`已載入：${fileName}`);
            } catch {
                if (token !== currentBookToken) return;
                showToast('EPUB 解析失敗，請確認檔案未受損或未受 DRM 保護。');
                pageInfo.textContent = '載入失敗';
            }
        }

        function initEpubRendition(startCfi = null) {
            if (!book) return;
            const token = currentBookToken;

            if (!book.spine || !Array.isArray(book.spine.spineItems) || book.spine.spineItems.length === 0) {
                showToast('此 EPUB 檔案缺少有效章節，無法開啟。');
                return;
            }

            if (rendition) {
                try { rendition.destroy(); } catch {}
                rendition = null;
            }
            epubViewer.innerHTML = '';

            const targetDirection = state.direction === 'vertical' ? 'rtl' : 'ltr';
            if (book.package && book.package.metadata) {
                book.package.metadata.direction = targetDirection;
            }

            const viewerWidth = Math.floor(epubViewer.clientWidth) || window.innerWidth;
            const viewerHeight = Math.floor(epubViewer.clientHeight) || (window.innerHeight - 130);

            rendition = book.renderTo('epubViewer', {
                width: viewerWidth,
                height: viewerHeight,
                spread: 'none',
                manager: 'default',
                flow: 'paginated',
                defaultDirection: targetDirection
            });

            rendition.hooks.content.register((contents) => {
                return injectFontsAndStylesToEpubContent(contents);
            });

            rendition.on('relocated', (location) => {
                if (token !== currentBookToken) return;
                if (location && location.start && location.start.cfi) {
                    state.epubCfi = location.start.cfi;
                }
                updateEpubPagination(location);
            });

            rendition.on('selected', (cfiRange, contents) => {
                selectedCfi = cfiRange;
                try {
                    selectedEpubText = contents && contents.window
                        ? contents.window.getSelection().toString().replace(/\s+/g, ' ').trim()
                        : '';
                } catch {
                    selectedEpubText = '';
                }
            });

            const displayPromise = startCfi
                ? rendition.display(startCfi).catch(() => rendition.display())
                : rendition.display();

            displayPromise.then(() => {
                if (token !== currentBookToken || !book || !rendition) return;
                restoreEpubHighlights();
                updateEpubPagination();

                if (epubLocations.length === 0 && !epubLocationsFailed && book.locations && typeof book.locations.generate === 'function') {
                    Promise.resolve()
                        .then(() => book.locations.generate(800))
                        .then(locations => {
                            if (token !== currentBookToken || !book) return;
                            if (Array.isArray(locations) && locations.length > 0) {
                                epubLocations = locations;
                                updateEpubPagination();
                            }
                        })
                        .catch(() => {
                            if (token !== currentBookToken) return;
                            epubLocationsFailed = true;
                            epubLocations = [];
                            updateEpubPagination();
                        });
                }
            }).catch(() => {
                if (token !== currentBookToken) return;
                showToast('EPUB 檔案無法正常顯示，請確認檔案是否完整或未受 DRM 加密。');
            });
        }

        function updateEpubPagination(location) {
            if (!book || !rendition) return;
            let currentLocation = location;
            if (!currentLocation) {
                try {
                    currentLocation = rendition.currentLocation();
                } catch {
                    return;
                }
            }
            if (!currentLocation || !currentLocation.start) return;

            const displayed = currentLocation.start.displayed;
            let overallText = '';

            if (epubLocations.length > 0 && currentLocation.start.cfi) {
                try {
                    let percent = book.locations.percentageFromCfi(currentLocation.start.cfi);
                    if (typeof percent === 'number' && !isNaN(percent)) {
                        percent = Math.min(1, Math.max(0, percent));
                        overallText = `（全書 ${Math.round(percent * 100)}%）`;
                    }
                } catch {}
            } else if (book.spine && Array.isArray(book.spine.spineItems) && book.spine.spineItems.length > 0 && typeof currentLocation.start.index === 'number') {
                const totalChapters = book.spine.spineItems.length;
                const chapterRatio = (displayed && displayed.page && displayed.total)
                    ? (displayed.page / displayed.total)
                    : 0;
                const estPercent = Math.min(1, Math.max(0, (currentLocation.start.index + chapterRatio) / totalChapters));
                overallText = `（全書 ${Math.round(estPercent * 100)}%）`;
            }

            if (displayed && displayed.page && displayed.total) {
                pageInfo.textContent = `目前頁數 ${displayed.page} / 總頁數 ${displayed.total}${overallText}`;
            } else if (overallText) {
                pageInfo.textContent = `閱讀中${overallText}`;
            }
        }

        function scheduleEpubResize() {
            if (state.mode !== 'epub' || !rendition) return;
            clearTimeout(epubResizeTimer);
            epubResizeTimer = setTimeout(() => {
                if (state.mode !== 'epub' || !rendition) return;
                const w = Math.floor(epubViewer.clientWidth) || window.innerWidth;
                const h = Math.floor(epubViewer.clientHeight) || (window.innerHeight - 130);
                try {
                    rendition.resize(w, h);
                    updateEpubPagination();
                } catch {}
            }, 120);
        }

        // === 目錄 (TOC) 遞迴渲染 ===
        function renderTOC(items) {
            tocList.innerHTML = '';
            if (!items || items.length === 0) {
                tocList.innerHTML = '<li class="muted-text">此書未提供目錄</li>';
                return;
            }

            function appendItems(list, depth = 0) {
                list.forEach(item => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'toc-item-btn';
                    btn.style.paddingLeft = `${8 + depth * 16}px`;
                    btn.textContent = (item.label || '未命名章節').trim();

                    btn.addEventListener('click', () => {
                        if (!rendition || !item.href) return;
                        rendition.display(item.href).then(() => {
                            updateEpubPagination();
                            sidebarTOC.classList.add('hidden');
                        }).catch(() => {
                            const baseHref = item.href.split('#')[0];
                            rendition.display(baseHref).then(() => {
                                updateEpubPagination();
                                sidebarTOC.classList.add('hidden');
                            }).catch(() => {
                                showToast('無法跳轉至此章節。');
                            });
                        });
                    });

                    li.appendChild(btn);
                    tocList.appendChild(li);

                    if (item.subitems && item.subitems.length > 0) {
                        appendItems(item.subitems, depth + 1);
                    }
                });
            }

            appendItems(items, 0);
        }

        // === 樣式與字體同步引擎 ===
        async function injectFontsAndStylesToEpubContent(contents) {
            if (!contents || !contents.document) return;
            const docObj = contents.document;
            const head = docObj.head || docObj.getElementsByTagName('head')[0];

            // 1. 有網路時注入雲端字體
            if (navigator.onLine && head && !docObj.getElementById('eink-cloud-fonts')) {
                const fontStyle = docObj.createElement('style');
                fontStyle.id = 'eink-cloud-fonts';
                fontStyle.textContent = getCloudFontsCss();
                head.appendChild(fontStyle);
            }

            // 2. 注入本機自訂字體（100% 離線跨 iframe 生效）
            if (contents.window && contents.window.FontFace && docObj.fonts && customFonts.length > 0) {
                for (const fontEntry of customFonts) {
                    const alreadyLoaded = [...docObj.fonts].some(f => f.family.replace(/['"]/g, '') === fontEntry.familyName);
                    if (!alreadyLoaded) {
                        try {
                            const clonedBuffer = fontEntry.buffer.slice(0);
                            const face = new contents.window.FontFace(fontEntry.familyName, clonedBuffer);
                            await face.load();
                            docObj.fonts.add(face);
                        } catch {}
                    }
                }
            }

            // 3. 強制套用字體、大小、行距、深淺色與直橫排
            const bgColor = state.isDarkMode ? '#0E0F17' : 'transparent';
            const textColor = state.isDarkMode ? '#F2F3F9' : '#2B2D40';
            const isVertical = state.direction === 'vertical';
            const writingMode = isVertical ? 'vertical-rl' : 'horizontal-tb';
            const fontFamilyRule = state.fontFamily && state.fontFamily !== 'inherit'
                ? `font-family: ${state.fontFamily} !important;`
                : '';

            // 直排專用修正：解除 epub.js 橫排多欄寬度對垂直軸的干擾，並重置上下留白讓文字緊貼頂端對齊
            const verticalFixCss = isVertical ? `
                html {
                    column-width: auto !important;
                    -webkit-column-width: auto !important;
                    column-count: auto !important;
                    -webkit-column-count: auto !important;
                    columns: auto !important;
                    column-gap: 0 !important;
                    height: 100vh !important;
                    max-height: 100vh !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    box-sizing: border-box !important;
                    vertical-align: top !important;
                }
                body {
                    column-width: auto !important;
                    -webkit-column-width: auto !important;
                    column-count: auto !important;
                    -webkit-column-count: auto !important;
                    columns: auto !important;
                    height: 100% !important;
                    max-height: 100% !important;
                    margin: 0 !important;
                    padding: 12px 20px !important;
                    box-sizing: border-box !important;
                    vertical-align: top !important;
                    text-align: start !important;
                    text-orientation: mixed !important;
                }
                section, article, div, p, blockquote, ul, ol, li, h1, h2, h3, h4, h5, h6 {
                    margin-top: 0 !important;
                    margin-bottom: 0 !important;
                    padding-top: 0 !important;
                    padding-bottom: 0 !important;
                    vertical-align: top !important;
                }
                p, blockquote, h1, h2, h3, h4, h5, h6 {
                    margin-left: 0.6em !important;
                    margin-right: 0 !important;
                }
            ` : '';

            let overrideStyle = docObj.getElementById('eink-epub-override');
            if (!overrideStyle && head) {
                overrideStyle = docObj.createElement('style');
                overrideStyle.id = 'eink-epub-override';
                head.appendChild(overrideStyle);
            }
            if (overrideStyle) {
                overrideStyle.textContent = `
                    html, body {
                        background-color: ${bgColor} !important;
                        color: ${textColor} !important;
                        writing-mode: ${writingMode} !important;
                        -webkit-writing-mode: ${writingMode} !important;
                        ${fontFamilyRule}
                        font-size: ${state.fontSize}px !important;
                        line-height: ${state.lineHeight} !important;
                    }
                    p, div, span, li, blockquote, h1, h2, h3, h4, h5, h6, a {
                        color: ${textColor} !important;
                        background-color: transparent !important;
                        ${fontFamilyRule}
                        line-height: ${state.lineHeight} !important;
                    }
                    p, div, span, li, blockquote {
                        font-size: ${state.fontSize}px !important;
                    }
                    ${verticalFixCss}
                `;
            }
        }

        function applyDarkModeUI() {
            const htmlEl = document.documentElement;
            if (state.isDarkMode) {
                htmlEl.classList.add('dark');
                htmlEl.classList.remove('light');
            } else {
                htmlEl.classList.remove('dark');
                htmlEl.classList.add('light');
            }
            applyBackgroundLayerUI();
        }

        function applyStyles() {
            txtContent.style.fontSize = `${state.fontSize}px`;
            txtContent.style.lineHeight = `${state.lineHeight}`;
            txtContent.style.fontFamily = state.fontFamily;
            txtContent.style.color = state.isDarkMode ? '#F2F3F9' : '#2B2D40';
            txtContent.style.backgroundColor = 'transparent';

            if (state.mode === 'txt') {
                requestAnimationFrame(() => recalculateTxtPagination(true));
            }

            if (state.mode === 'epub' && rendition) {
                const contentsList = rendition.getContents();
                if (Array.isArray(contentsList)) {
                    Promise.all(contentsList.map(c => injectFontsAndStylesToEpubContent(c)))
                        .then(() => scheduleEpubResize())
                        .catch(() => {});
                }
            }
        }

        // === 設定事件 ===
        fontSelect.addEventListener('change', (e) => {
            state.fontFamily = e.target.value;
            applyStyles();
            saveLocalSettings();
        });

        fontInput.addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            const baseName = file.name.replace(/\.(ttf|ttc)$/i, '');
            const uniqueFamily = `CustomFont_${Date.now()}`;

            try {
                const buffer = await file.arrayBuffer();
                const face = new FontFace(uniqueFamily, buffer.slice(0));
                await face.load();
                document.fonts.add(face);

                const entry = { familyName: uniqueFamily, displayName: baseName, buffer };
                customFonts.push(entry);
                await saveFontToIndexedDB(entry);

                const option = document.createElement('option');
                option.value = `'${uniqueFamily}', sans-serif`;
                option.textContent = `[自訂] ${baseName}`;
                fontSelect.appendChild(option);
                fontSelect.value = option.value;

                state.fontFamily = option.value;
                applyStyles();
                saveLocalSettings();
                showToast(`已匯入並離線保存字體：${baseName}`);
            } catch {
                showToast('字體載入失敗（部分系統不支援 .ttc 合集字體，建議改用 .ttf 檔案）。');
            }

            fontInput.value = '';
        });

        directionSelect.addEventListener('change', (e) => {
            state.direction = e.target.value;
            saveLocalSettings();

            if (state.mode === 'epub' && book) {
                initEpubRendition(state.epubCfi);
            } else {
                applyStyles();
            }
        });

        fontSizeSlider.addEventListener('input', (e) => {
            state.fontSize = parseInt(e.target.value, 10);
            fontSizeDisplay.textContent = `${state.fontSize}px`;
            applyStyles();
            saveLocalSettings();
        });

        lineHeightSlider.addEventListener('input', (e) => {
            state.lineHeight = parseFloat(e.target.value);
            lineHeightDisplay.textContent = state.lineHeight.toFixed(1);
            applyStyles();
            saveLocalSettings();
        });

        bgOpacitySlider.addEventListener('input', (e) => {
            state.bgOpacity = parseInt(e.target.value, 10);
            bgOpacityDisplay.textContent = `${state.bgOpacity}%`;
            applyBackgroundLayerUI();
            saveLocalSettings();
        });

        bgImageInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                state.customBgDataUrl = reader.result;
                applyBackgroundLayerUI();
                saveLocalSettings();
                showToast('已套用自訂淡色背景圖片！');
            };
            reader.readAsDataURL(file);
            bgImageInput.value = '';
        });

        btnDarkMode.addEventListener('click', () => {
            state.isDarkMode = !state.isDarkMode;
            applyDarkModeUI();
            applyStyles();
            saveLocalSettings();
        });

        btnSync.addEventListener('click', () => {
            syncToCloud();
        });

        // === 翻頁事件 ===
        function goPrevPage() {
            if (state.mode === 'txt') {
                goToTxtPage(state.txtPage - 1);
            } else if (state.mode === 'epub' && rendition && !isEpubNavigating) {
                isEpubNavigating = true;
                rendition.prev().catch(() => {}).finally(() => { isEpubNavigating = false; });
            }
        }

        function goNextPage() {
            if (state.mode === 'txt') {
                goToTxtPage(state.txtPage + 1);
            } else if (state.mode === 'epub' && rendition && !isEpubNavigating) {
                isEpubNavigating = true;
                rendition.next().catch(() => {}).finally(() => { isEpubNavigating = false; });
            }
        }

        btnPrevPage.addEventListener('click', goPrevPage);
        btnNextPage.addEventListener('click', goNextPage);

        document.addEventListener('keydown', (e) => {
            if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
            if (e.key === 'ArrowLeft') {
                if (state.direction === 'vertical') goNextPage();
                else goPrevPage();
            } else if (e.key === 'ArrowRight') {
                if (state.direction === 'vertical') goPrevPage();
                else goNextPage();
            }
        });

        window.addEventListener('resize', () => {
            if (state.mode === 'txt') recalculateTxtPagination(true);
            else if (state.mode === 'epub') scheduleEpubResize();
        });

        // === 畫線註記、統整清單與依顏色篩選跳轉 ===
        function getBookHighlights() {
            const key = state.currentFile || 'default';
            if (!Array.isArray(state.highlightsByBook[key])) state.highlightsByBook[key] = [];
            return state.highlightsByBook[key];
        }

        function getColorName(colorCode) {
            const found = HIGHLIGHT_COLORS.find(c => c.code.toLowerCase() === String(colorCode || '').toLowerCase());
            return found ? found.name : '標記';
        }

        function restoreEpubHighlights() {
            if (state.mode !== 'epub' || !rendition) return;
            getBookHighlights()
                .filter(item => item && item.cfi)
                .forEach(item => {
                    try {
                        rendition.annotations.highlight(
                            item.cfi,
                            {},
                            () => { selectedCfi = item.cfi; },
                            'eink-hl',
                            { fill: item.color || '#FFFF00', 'fill-opacity': '0.45' }
                        );
                    } catch {}
                });
        }

        function renderHighlightSummary() {
            const allItems = getBookHighlights().filter(Boolean);

            // 1. 渲染顏色篩選按鈕列
            highlightFilterBar.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.type = 'button';
            allBtn.className = `hl-filter-chip ${state.activeHighlightFilter === 'all' ? 'active-chip' : ''}`;
            allBtn.textContent = `全部 (${allItems.length})`;
            allBtn.addEventListener('click', () => {
                state.activeHighlightFilter = 'all';
                renderHighlightSummary();
            });
            highlightFilterBar.appendChild(allBtn);

            HIGHLIGHT_COLORS.forEach(c => {
                const count = allItems.filter(item => String(item.color || '').toLowerCase() === c.code.toLowerCase()).length;
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = `hl-filter-chip ${String(state.activeHighlightFilter).toLowerCase() === c.code.toLowerCase() ? 'active-chip' : ''}`;
                chip.innerHTML = `<span class="hl-dot" style="background-color:${c.code};"></span><span>${c.name} (${count})</span>`;
                chip.addEventListener('click', () => {
                    state.activeHighlightFilter = c.code;
                    renderHighlightSummary();
                });
                highlightFilterBar.appendChild(chip);
            });

            // 2. 篩選並渲染畫線文字卡片
            const filtered = state.activeHighlightFilter === 'all'
                ? allItems
                : allItems.filter(item => String(item.color || '').toLowerCase() === String(state.activeHighlightFilter).toLowerCase());

            highlightList.innerHTML = '';

            if (!state.mode) {
                highlightList.innerHTML = '<li class="muted-text">請先匯入書籍後再檢視畫線統整</li>';
                return;
            }

            if (filtered.length === 0) {
                const colorLabel = state.activeHighlightFilter === 'all' ? '' : `「${getColorName(state.activeHighlightFilter)}色」`;
                highlightList.innerHTML = `<li class="muted-text">目前尚無${colorLabel}畫線紀錄</li>`;
                return;
            }

            filtered.forEach(item => {
                const li = document.createElement('li');
                li.className = 'hl-card';
                li.style.borderLeftColor = item.color || '#FFFF00';

                const meta = document.createElement('div');
                meta.className = 'hl-card-meta';

                const tagSpan = document.createElement('span');
                const locLabel = item.pageLabel || (item.type === 'txt' ? `第 ${(item.page || 0) + 1} 頁` : 'EPUB 標記');
                tagSpan.textContent = `${getColorName(item.color)}色 ｜ ${locLabel}`;

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'bookmark-del-btn';
                delBtn.textContent = '刪除';
                delBtn.addEventListener('click', () => removeHighlightById(item));

                meta.appendChild(tagSpan);
                meta.appendChild(delBtn);

                const jumpBtn = document.createElement('button');
                jumpBtn.type = 'button';
                jumpBtn.className = 'hl-card-text-btn';
                jumpBtn.textContent = item.text || '（點擊跳轉至該畫線位置）';
                jumpBtn.addEventListener('click', () => jumpToHighlight(item));

                li.appendChild(meta);
                li.appendChild(jumpBtn);
                highlightList.appendChild(li);
            });
        }

        function jumpToHighlight(item) {
            if (!item) return;

            if ((item.type === 'epub' || item.cfi) && state.mode === 'epub' && rendition && item.cfi) {
                rendition.display(item.cfi).then(() => {
                    updateEpubPagination();
                    sidebarHighlights.classList.add('hidden');
                    showToast('已跳轉至該畫線頁面。');
                }).catch(() => {
                    showToast('無法跳轉至此畫線位置。');
                });
                return;
            }

            if (state.mode === 'txt') {
                const markEl = item.id ? txtContent.querySelector(`mark[data-hl-id="${item.id}"]`) : null;
                if (markEl) {
                    const viewerWidth = Math.floor(txtViewer.clientWidth) || window.innerWidth;
                    const viewerRect = txtViewer.getBoundingClientRect();
                    const markRect = markEl.getBoundingClientRect();
                    if (state.direction === 'vertical') {
                        const offsetFromRight = (viewerRect.right - markRect.right) - txtViewer.scrollLeft;
                        const targetPage = Math.max(0, Math.floor(offsetFromRight / viewerWidth));
                        goToTxtPage(targetPage);
                    } else {
                        const offsetFromLeft = (markRect.left - viewerRect.left) + txtViewer.scrollLeft;
                        const targetPage = Math.max(0, Math.floor(offsetFromLeft / viewerWidth));
                        goToTxtPage(targetPage);
                    }
                } else if (typeof item.page === 'number') {
                    goToTxtPage(item.page);
                }
                sidebarHighlights.classList.add('hidden');
                showToast('已跳轉至該畫線頁面。');
            }
        }

        function removeHighlightById(item) {
            const list = getBookHighlights();
            if (item.cfi && state.mode === 'epub' && rendition) {
                try { rendition.annotations.remove(item.cfi, 'highlight'); } catch {}
            }
            if (item.id && state.mode === 'txt') {
                const markEl = txtContent.querySelector(`mark[data-hl-id="${item.id}"]`);
                if (markEl) {
                    const parent = markEl.parentNode;
                    while (markEl.firstChild) parent.insertBefore(markEl.firstChild, markEl);
                    parent.removeChild(markEl);
                }
            }
            state.highlightsByBook[state.currentFile] = list.filter(h => {
                if (!h) return false;
                if (item.id && h.id) return h.id !== item.id;
                if (item.cfi && h.cfi) return h.cfi !== item.cfi;
                return h !== item;
            });
            saveLocalSettings();
            renderHighlightSummary();
            showToast('已刪除該畫線註記。');
        }

        async function applyHighlight(color) {
            if (state.mode === 'epub' && rendition) {
                if (!selectedCfi) {
                    showToast('請先在內文中反白選取文字，再選擇螢光筆顏色。');
                    return;
                }
                try {
                    const cfi = selectedCfi;
                    let textSnippet = selectedEpubText;
                    if (!textSnippet && book && typeof book.getRange === 'function') {
                        try {
                            const r = await book.getRange(cfi);
                            if (r) textSnippet = r.toString().replace(/\s+/g, ' ').trim();
                        } catch {}
                    }
                    if (!textSnippet) textSnippet = '（EPUB 畫線片段）';

                    rendition.annotations.remove(cfi, 'highlight');
                    rendition.annotations.highlight(
                        cfi,
                        {},
                        () => { selectedCfi = cfi; },
                        'eink-hl',
                        { fill: color, 'fill-opacity': '0.45' }
                    );

                    const newRecord = {
                        id: `hl_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                        type: 'epub',
                        cfi,
                        color,
                        text: textSnippet.slice(0, 120),
                        pageLabel: pageInfo.textContent.replace(/目前頁數\s*/, '第 ').replace(/\s*\/\s*總頁數.*/, ' 頁')
                    };

                    const list = getBookHighlights().filter(h => h && h.cfi !== cfi);
                    list.unshift(newRecord);
                    state.highlightsByBook[state.currentFile] = list;
                    saveLocalSettings();
                    renderHighlightSummary();
                    highlightMenu.classList.add('hidden');
                    showToast(`已加入${getColorName(color)}色畫線註記。`);
                } catch {
                    showToast('畫線失敗，請重新選取文字。');
                }
                return;
            }

            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || !txtContent.contains(sel.anchorNode)) {
                showToast('請先在內文中反白選取文字，再選擇螢光筆顏色。');
                return;
            }

            try {
                const textSnippet = sel.toString().replace(/\s+/g, ' ').trim();
                const range = sel.getRangeAt(0);
                const hlId = `hl_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
                const mark = document.createElement('mark');
                mark.className = 'highlight-bg';
                mark.dataset.hlId = hlId;
                mark.style.backgroundColor = color;
                const fragment = range.extractContents();
                mark.appendChild(fragment);
                range.insertNode(mark);
                sel.removeAllRanges();

                const list = getBookHighlights();
                list.unshift({
                    id: hlId,
                    type: 'txt',
                    color,
                    text: textSnippet.slice(0, 120) || '（TXT 畫線片段）',
                    page: state.txtPage,
                    pageLabel: `第 ${state.txtPage + 1} 頁`
                });
                state.highlightsByBook[state.currentFile] = list;
                saveLocalSettings();
                renderHighlightSummary();
                highlightMenu.classList.add('hidden');
                showToast(`已加入${getColorName(color)}色畫線註記。`);
            } catch {
                showToast('無法跨區段畫線，請選取同一段落內的文字。');
            }
        }

        function clearHighlight() {
            if (state.mode === 'epub' && rendition) {
                const list = getBookHighlights();
                const targetCfi = selectedCfi || (list.length > 0 && list[0] ? list[0].cfi : null);
                if (!targetCfi) {
                    showToast('請先點擊或選取要取消的畫線區域。');
                    return;
                }
                try {
                    rendition.annotations.remove(targetCfi, 'highlight');
                    state.highlightsByBook[state.currentFile] = list.filter(h => h && h.cfi !== targetCfi);
                    selectedCfi = null;
                    saveLocalSettings();
                    renderHighlightSummary();
                    highlightMenu.classList.add('hidden');
                    showToast('已取消畫線註記。');
                } catch {
                    showToast('取消畫線失敗，請重新選取。');
                }
                return;
            }

            const sel = window.getSelection();
            let removedIds = [];
            if (sel && !sel.isCollapsed) {
                const range = sel.getRangeAt(0);
                txtContent.querySelectorAll('mark.highlight-bg').forEach(mark => {
                    if (range.intersectsNode(mark)) {
                        if (mark.dataset.hlId) removedIds.push(mark.dataset.hlId);
                        const parent = mark.parentNode;
                        while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
                        parent.removeChild(mark);
                    }
                });
                sel.removeAllRanges();
            } else if (sel && sel.anchorNode) {
                const parentMark = sel.anchorNode.nodeType === 1
                    ? sel.anchorNode.closest('mark.highlight-bg')
                    : (sel.anchorNode.parentElement ? sel.anchorNode.parentElement.closest('mark.highlight-bg') : null);
                if (parentMark) {
                    if (parentMark.dataset.hlId) removedIds.push(parentMark.dataset.hlId);
                    const parent = parentMark.parentNode;
                    while (parentMark.firstChild) parent.insertBefore(parentMark.firstChild, parentMark);
                    parent.removeChild(parentMark);
                }
            }

            if (removedIds.length > 0) {
                state.highlightsByBook[state.currentFile] = getBookHighlights().filter(h => h && !removedIds.includes(h.id));
                saveLocalSettings();
                renderHighlightSummary();
            }

            highlightMenu.classList.add('hidden');
            showToast(removedIds.length > 0 ? '已取消畫線註記。' : '請先選取或點擊已畫線的文字區域。');
        }

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => applyHighlight(btn.dataset.color));
        });
        btnClearHighlight.addEventListener('click', clearHighlight);

        // === 書籤功能 ===
        function getBookBookmarks() {
            const key = state.currentFile || 'default';
            if (!Array.isArray(state.bookmarksByBook[key])) state.bookmarksByBook[key] = [];
            return state.bookmarksByBook[key];
        }

        function extractCurrentPageSnippet() {
            if (state.mode === 'txt') {
                const totalLen = state.txtContent.length;
                if (totalLen === 0) return '空白頁面';
                const estStart = Math.floor((state.txtPage / Math.max(1, state.txtTotalPages)) * totalLen);
                const snippet = state.txtContent.slice(estStart, estStart + 60).replace(/\s+/g, ' ').trim();
                return snippet.slice(0, 15) || `第 ${state.txtPage + 1} 頁`;
            }

            if (state.mode === 'epub' && rendition) {
                try {
                    const loc = rendition.currentLocation();
                    const cfi = loc && loc.start ? loc.start.cfi : null;
                    const contentsList = rendition.getContents();
                    if (cfi && contentsList && contentsList.length > 0) {
                        const range = rendition.getRange(cfi);
                        if (range) {
                            const containerText = (range.startContainer.textContent || '').slice(range.startOffset);
                            const bodyText = (contentsList[0].document.body ? contentsList[0].document.body.innerText : '').replace(/\s+/g, ' ').trim();
                            const clean = (containerText.replace(/\s+/g, ' ').trim() || bodyText).slice(0, 15);
                            if (clean) return clean;
                        }
                    }
                } catch {}
                return pageInfo.textContent.slice(0, 15) || 'EPUB 書籤';
            }

            return '尚未載入書籍';
        }

        function renderBookmarks() {
            const list = getBookBookmarks().filter(Boolean);
            bookmarkList.innerHTML = '';
            if (!list || list.length === 0) {
                bookmarkList.innerHTML = '<li class="muted-text">尚無書籤</li>';
                return;
            }

            list.forEach(bm => {
                const li = document.createElement('li');
                li.className = 'bookmark-item';

                const jumpBtn = document.createElement('button');
                jumpBtn.type = 'button';
                jumpBtn.className = 'bookmark-jump-btn';
                jumpBtn.textContent = bm.label;
                jumpBtn.addEventListener('click', () => {
                    if (bm.type === 'txt' && state.mode === 'txt') {
                        goToTxtPage(bm.page);
                        sidebarBookmarks.classList.add('hidden');
                    } else if (bm.type === 'epub' && state.mode === 'epub' && rendition && bm.cfi) {
                        rendition.display(bm.cfi).then(() => {
                            updateEpubPagination();
                            sidebarBookmarks.classList.add('hidden');
                        }).catch(() => {
                            showToast('無法跳轉至此書籤位置。');
                        });
                    }
                });

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'bookmark-del-btn';
                delBtn.textContent = '刪除';
                delBtn.addEventListener('click', () => {
                    state.bookmarksByBook[state.currentFile] = getBookBookmarks().filter(item => item && item.id !== bm.id);
                    saveLocalSettings();
                    renderBookmarks();
                });

                li.appendChild(jumpBtn);
                li.appendChild(delBtn);
                bookmarkList.appendChild(li);
            });
        }

        btnAddBookmark.addEventListener('click', () => {
            if (!state.mode) {
                showToast('請先匯入書籍再新增書籤。');
                return;
            }

            const snippet = extractCurrentPageSnippet();
            const bookmark = {
                id: `${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                label: snippet.length >= 15 ? `${snippet}...` : snippet,
                type: state.mode,
                page: state.txtPage,
                cfi: state.epubCfi
            };

            const list = getBookBookmarks();
            list.unshift(bookmark);
            state.bookmarksByBook[state.currentFile] = list;
            saveLocalSettings();
            renderBookmarks();
            showToast(`已新增書籤：「${bookmark.label}」`);
        });

        // === 啟動初始化流程 ===
        initOptionalFirebase();
        restoreSavedFontsFromIndexedDB();
        initOfflineEpubEngine();
        loadOptionalCloudFonts();
        registerServiceWorker();
    })();
    </script>
</body>
