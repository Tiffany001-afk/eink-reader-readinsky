<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EFEBF5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>E-Ink 專屬電子書閱讀器 (莫蘭迪藍紫離線版)</title>
    <!-- PWA Manifest (於網頁伺服器環境生效) -->
    <link rel="manifest" href="./manifest.json">

    <style>
        /* =========================================================
           100% 離線內建樣式：淡色系莫蘭迪藍紫風格（兼顧電子紙清晰度）
           ========================================================= */
        :root {
            --bg: #F8F7FB;
            --surface: #EFEBF6;
            --surface-soft: #F4F1FA;
            --surface-hover: #E1DBEE;
            --accent: #7F86AD;
            --accent-strong: #5E658C;
            --fg: #2B2D40;
            --border: #9CA1BE;
            --border-strong: #7F86AD;
            --muted: #707491;
            --overlay: rgba(245, 243, 250, 0.90);
            --btn-active-bg: #6B7299;
            --btn-active-fg: #FFFFFF;
        }

        html.dark {
            --bg: #0E0F17;
            --surface: #171926;
            --surface-soft: #1D2030;
            --surface-hover: #2A2E45;
            --accent: #9AA2CC;
            --accent-strong: #B6BDE0;
            --fg: #F2F3F9;
            --border: #555B7A;
            --border-strong: #8B92B8;
            --muted: #A9AFC9;
            --overlay: rgba(14, 15, 23, 0.92);
            --btn-active-bg: #D8DCF0;
            --btn-active-fg: #12141F;
        }

        /* 保留電子紙友善設計：移除過場動畫與重陰影，避免殘影 */
        * {
            box-sizing: border-box;
            transition: none !important;
            animation: none !important;
            box-shadow: none !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "LINE Seed TW", "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            border: 4px solid var(--border-strong);
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .hidden {
            display: none !important;
        }

        /* 通用按鈕與表單元件 */
        .eink-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 2px solid var(--border-strong);
            border-radius: 6px;
            background-color: var(--bg);
            color: var(--fg);
            padding: 6px 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            user-select: none;
        }

        .eink-btn:hover {
            background-color: var(--surface-hover);
        }

        .eink-btn:active,
        .eink-btn.active-btn {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
            border-color: var(--accent-strong);
        }

        .eink-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .eink-btn-full {
            width: 100%;
            padding: 10px 12px;
        }

        .eink-select,
        .eink-input {
            width: 100%;
            border: 2px solid var(--border-strong);
            border-radius: 6px;
            background-color: var(--bg);
            color: var(--fg);
            padding: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        /* 頂部工具列 */
        .app-header {
            border-bottom: 3px solid var(--border-strong);
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
            z-index: 30;
            background-color: var(--surface);
            position: relative;
        }

        .header-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .dropdown-anchor {
            position: relative;
        }

        /* 雲端匯入下拉選單 */
        .cloud-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 224px;
            background-color: var(--bg);
            border: 3px solid var(--border-strong);
            border-radius: 8px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cloud-menu button {
            text-align: left;
            padding: 10px 12px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--fg);
            cursor: pointer;
        }

        .cloud-menu button:last-child {
            border-bottom: none;
        }

        .cloud-menu button:hover {
            background-color: var(--surface-hover);
        }

        .cloud-menu button:active {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
        }

        /* 畫線註記浮動選單 */
        .highlight-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background-color: var(--surface-soft);
            border: 3px solid var(--border-strong);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
            min-width: 270px;
        }

        .highlight-swatches-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .highlight-actions-row {
            display: flex;
            gap: 8px;
        }

        .highlight-actions-row .eink-btn {
            flex: 1;
            font-size: 14px;
            padding: 7px 8px;
        }

        .color-btn {
            width: 34px;
            height: 34px;
            border: 2px solid var(--accent-strong);
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
        }

        .bookmark-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
        }

        html.dark .bookmark-img {
            filter: invert(1);
        }

        /* 主容器與側邊欄 */
        .app-body {
            flex: 1;
            min-height: 0;
            display: flex;
            position: relative;
            overflow: hidden;
            background-color: var(--bg);
        }

        .sidebar {
            position: absolute;
            top: 0;
            height: 100%;
            width: 82%;
            max-width: 340px;
            background-color: var(--surface-soft);
            z-index: 25;
            display: flex;
            flex-direction: column;
        }

        .sidebar-left {
            left: 0;
            border-right: 3px solid var(--border-strong);
        }

        .sidebar-right {
            right: 0;
            border-left: 3px solid var(--border-strong);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 3px solid var(--border-strong);
            background-color: var(--surface);
        }

        .sidebar-title {
            margin: 0;
            font-size: 19px;
            font-weight: 700;
            color: var(--accent-strong);
        }

        .sidebar-action-bar {
            padding: 12px;
            border-bottom: 2px solid var(--border);
            background-color: var(--surface-soft);
        }

        .sidebar-content {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-list {
            list-style: none;
            margin: 0;
            padding: 12px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-weight: 700;
        }

        .muted-text {
            color: var(--muted);
            font-weight: 700;
            font-size: 14px;
            line-height: 1.5;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent-strong);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .range-slider {
            width: 100%;
            height: 24px;
            accent-color: var(--accent-strong);
        }

        .toc-item-btn {
            width: 100%;
            text-align: left;
            padding: 10px 8px;
            border: none;
            border-bottom: 1px solid var(--border);
            background-color: transparent;
            color: var(--fg);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .toc-item-btn:hover {
            background-color: var(--surface-hover);
        }

        .toc-item-btn:active {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
        }

        .bookmark-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .bookmark-jump-btn {
            flex: 1;
            min-width: 0;
            text-align: left;
            padding: 6px 4px;
            border: none;
            background-color: transparent;
            color: var(--fg);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-jump-btn:hover {
            background-color: var(--surface-hover);
        }

        .bookmark-del-btn {
            border: 2px solid var(--border-strong);
            border-radius: 4px;
            background-color: var(--bg);
            color: var(--fg);
            padding: 4px 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .bookmark-del-btn:active {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
        }

        /* 畫線註記統整：顏色篩選列與項目卡片 */
        .hl-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .hl-filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 9px;
            border: 2px solid var(--border-strong);
            border-radius: 999px;
            background-color: var(--bg);
            color: var(--fg);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .hl-filter-chip.active-chip {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
            border-color: var(--accent-strong);
        }

        .hl-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #333333;
            display: inline-block;
            flex-shrink: 0;
        }

        .hl-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 2px solid var(--border);
            border-left-width: 8px;
            border-radius: 6px;
            background-color: var(--bg);
            padding: 10px;
        }

        .hl-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .hl-card-text-btn {
            width: 100%;
            text-align: left;
            border: none;
            background-color: transparent;
            color: var(--fg);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
            padding: 2px 0;
            cursor: pointer;
            word-break: break-word;
        }

        .hl-card-text-btn:hover {
            text-decoration: underline;
        }

        /* 閱讀主畫面 + 極淡紫花瓣白布紋背景 */
        .reader-main {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 10px 20px;
            overflow: hidden;
            background-color: var(--bg);
        }

        /* 極淡莫蘭迪紫花瓣背景圖層（預設內建離線淡雅花瓣白布紋，亦可套用自訂背景圖） */
        .reader-bg-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 0.16;
            background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 900'%3E%3Cdefs%3E%3CradialGradient id='cloth' cx='50%25' cy='45%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23FFFFFF'/%3E%3Cstop offset='65%25' stop-color='%23F4F1FA'/%3E%3Cstop offset='100%25' stop-color='%23E7E3F3'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='1200' height='900' fill='url(%23cloth)'/%3E%3Cpath d='M0 240 Q320 190 640 250 T1200 220' fill='none' stroke='%23DCD7EB' stroke-width='28' opacity='0.35'/%3E%3Cpath d='M0 620 Q360 680 740 600 T1200 660' fill='none' stroke='%23E0DCF0' stroke-width='36' opacity='0.35'/%3E%3Cg opacity='0.78'%3E%3Cellipse cx='150' cy='140' rx='26' ry='14' transform='rotate(-28 150 140)' fill='%238E85C2'/%3E%3Cellipse cx='192' cy='168' rx='20' ry='11' transform='rotate(32 192 168)' fill='%23A9A1D6'/%3E%3Cellipse cx='126' cy='182' rx='18' ry='10' transform='rotate(-65 126 182)' fill='%237D8AC0'/%3E%3Cellipse cx='1040' cy='125' rx='24' ry='13' transform='rotate(24 1040 125)' fill='%239389C7'/%3E%3Cellipse cx='1082' cy='160' rx='18' ry='10' transform='rotate(-38 1082 160)' fill='%23B4ADD9'/%3E%3Cellipse cx='985' cy='170' rx='16' ry='9' transform='rotate(58 985 170)' fill='%238391C7'/%3E%3Cellipse cx='210' cy='760' rx='28' ry='14' transform='rotate(18 210 760)' fill='%239188C4'/%3E%3Cellipse cx='158' cy='720' rx='19' ry='10' transform='rotate(-44 158 720)' fill='%23B0A8D9'/%3E%3Cellipse cx='265' cy='790' rx='16' ry='9' transform='rotate(-15 265 790)' fill='%237E8BC2'/%3E%3Cellipse cx='1020' cy='760' rx='26' ry='13' transform='rotate(-22 1020 760)' fill='%238B82BF'/%3E%3Cellipse cx='1075' cy='722' rx='21' ry='11' transform='rotate(36 1075 722)' fill='%23A79FD4'/%3E%3Cellipse cx='970' cy='795' rx='17' ry='9' transform='rotate(12 970 795)' fill='%237F8EC4'/%3E%3Cellipse cx='590' cy='95' rx='18' ry='9' transform='rotate(15 590 95)' fill='%23A9A2D4'/%3E%3Cellipse cx='645' cy='815' rx='20' ry='10' transform='rotate(-20 645 815)' fill='%239C94CC'/%3E%3Cellipse cx='95' cy='460' rx='19' ry='10' transform='rotate(48 95 460)' fill='%239F97CF'/%3E%3Cellipse cx='1115' cy='445' rx='21' ry='11' transform='rotate(-52 1115 445)' fill='%238E96C9'/%3E%3C/g%3E%3C/svg%3E");
        }

        html.dark .reader-bg-layer {
            opacity: 0;
        }

        #epubViewer,
        #txtViewer {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        /* TXT 單頁分頁容器 */
        #txtViewer {
            scroll-behavior: auto;
        }

        #txtContent {
            height: 100%;
            column-gap: 0;
            column-fill: auto;
            word-break: break-word;
            text-align: justify;
            white-space: pre-wrap;
            font-size: 24px;
            line-height: 1.8;
            font-family: inherit;
            background-color: transparent;
        }

        /* TXT 直排模式（由右至左） */
        #txtViewer.vertical-mode #txtContent {
            writing-mode: vertical-rl;
            -webkit-writing-mode: vertical-rl;
            column-width: auto !important;
            width: auto;
            min-width: 100%;
            height: 100%;
        }

        .highlight-bg {
            color: #1F2030 !important;
            padding: 0 2px;
            border-radius: 2px;
        }

        /* 底部控制列 */
        .app-footer {
            height: 60px;
            border-top: 3px solid var(--border-strong);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            background-color: var(--surface);
        }

        .page-btn {
            height: 100%;
            padding: 0 24px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            background-color: var(--surface);
            color: var(--fg);
            cursor: pointer;
            white-space: nowrap;
        }

        .page-btn:hover {
            background-color: var(--surface-hover);
        }

        .page-btn-prev {
            border-right: 3px solid var(--border-strong);
        }

        .page-btn-next {
            border-left: 3px solid var(--border-strong);
        }

        .page-btn:active {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
        }

        .page-info {
            font-weight: 700;
            font-size: 15px;
            padding: 0 12px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--accent-strong);
        }

        /* 雲端匯入視窗 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--overlay);
            padding: 16px;
        }

        .modal-box {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg);
            border: 3px solid var(--border-strong);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }

        .modal-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-strong);
        }

        .modal-desc {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.6;
        }

        .modal-status {
            border: 2px solid var(--border-strong);
            border-radius: 6px;
            background-color: var(--surface-soft);
            padding: 8px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }

        .modal-status a {
            color: var(--accent-strong);
            text-decoration: underline;
        }

        .modal-divider {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 10px;
            border-top: 2px solid var(--border);
        }

        /* 離線狀態徽章 */
        .offline-badge {
            font-size: 12px;
            border: 2px solid var(--border-strong);
            border-radius: 6px;
            background-color: var(--bg);
            color: var(--accent-strong);
            padding: 6px 8px;
            font-weight: 700;
            text-align: center;
        }

        /* 狀態提示列 */
        .toast-box {
            position: fixed;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            background-color: var(--accent-strong);
            color: #FFFFFF;
            border: 2px solid var(--border-strong);
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 15px;
            max-width: 90vw;
            text-align: center;
        }

        @media (min-width: 768px) {
            .reader-main {
                padding: 12px 36px;
            }
            .page-btn {
                padding: 0 44px;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部工具列 -->
    <header class="app-header">
        <div class="header-group">
            <label class="eink-btn">
                匯入書籍(EPUB/TXT)
                <input type="file" id="fileInput" accept=".epub,.txt" class="hidden">
            </label>

            <div class="dropdown-anchor">
                <button id="btnCloudImport" type="button" class="eink-btn">
                    從雲端匯入
                </button>
                <div id="cloudImportMenu" class="cloud-menu hidden">
                    <button type="button" class="cloud-source-btn" data-provider="google">1. Google雲端</button>
                    <button type="button" class="cloud-source-btn" data-provider="mega">2. Mega雲端</button>
                    <button type="button" class="cloud-source-btn" data-provider="readmoo">3. Readmoo 讀墨</button>
                    <button type="button" class="cloud-source-btn" data-provider="kobo">4. Kobo</button>
                    <button type="button" class="cloud-source-btn" data-provider="kindle">5. Kindle</button>
                    <button type="button" class="cloud-source-btn" data-provider="hyread">6. HyRead 個人書房</button>
                    <button type="button" class="cloud-source-btn" data-provider="boox">7. 文石雲端</button>
                </div>
            </div>

            <button id="btnToggleTOC" type="button" class="eink-btn">
                選擇章節
            </button>
        </div>

        <div class="header-group">
            <button id="btnToggleHighlight" type="button" class="eink-btn">
                畫線註記
            </button>

            <button id="btnToggleBookmarks" type="button" class="eink-btn">
                <img src="bookmark_2.png" class="bookmark-icon bookmark-img" alt="書籤" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                <svg class="bookmark-icon hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M5 3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v19l-7-4-7 4V3z"/>
                </svg>
                <span>書籤</span>
            </button>

            <button id="btnToggleSettings" type="button" class="eink-btn">
                設定
            </button>

            <!-- 畫線註記浮動選單 -->
            <div id="highlightMenu" class="highlight-menu hidden">
                <div class="highlight-swatches-row">
                    <button type="button" class="color-btn" style="background-color:#FFB6C1;" data-color="#FFB6C1" title="螢光粉紅"></button>

    <!-- 主程式邏輯（100% 離線可啟動） -->
    <script>
    (function() {
        'use strict';

        // === DOM 元素參照 ===
        const fileInput = document.getElementById('fileInput');
        const btnCloudImport = document.getElementById('btnCloudImport');
        const cloudImportMenu = document.getElementById('cloudImportMenu');

        const cloudFileUrl = document.getElementById('cloudFileUrl');
        const btnLoadCloudUrl = document.getElementById('btnLoadCloudUrl');
        const cloudModalStatus = document.getElementById('cloudModalStatus');
        const cloudPortalLink = document.getElementById('cloudPortalLink');
        const btnPickLocalFromCloud = document.getElementById('btnPickLocalFromCloud');
        const btnCloseCloudModal = document.getElementById('btnCloseCloudModal');

        const btnToggleTOC = document.getElementById('btnToggleTOC');
        const sidebarTOC = document.getElementById('sidebarTOC');
        const btnCloseTOC = document.getElementById('btnCloseTOC');
        const tocList = document.getElementById('tocList');

        const btnToggleHighlight = document.getElementById('btnToggleHighlight');
        const highlightMenu = document.getElementById('highlightMenu');
        const btnOpenHighlightList = document.getElementById('btnOpenHighlightList');
        const btnClearHighlight = document.getElementById('btnClearHighlight');

        const sidebarHighlights = document.getElementById('sidebarHighlights');
        const btnCloseHighlights = document.getElementById('btnCloseHighlights');
        const highlightFilterBar = document.getElementById('highlightFilterBar');
        const highlightList = document.getElementById('highlightList');

        const btnToggleBookmarks = document.getElementById('btnToggleBookmarks');
        const sidebarBookmarks = document.getElementById('sidebarBookmarks');
        const btnCloseBookmarks = document.getElementById('btnCloseBookmarks');
        const btnAddBookmark = document.getElementById('btnAddBookmark');
        const bookmarkList = document.getElementById('bookmarkList');

        const btnToggleSettings = document.getElementById('btnToggleSettings');
        const sidebarSettings = document.getElementById('sidebarSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');
        const engineStatusBadge = document.getElementById('engineStatusBadge');

        const fontSelect = document.getElementById('fontSelect');
        const fontInput = document.getElementById('fontInput');
        const directionSelect = document.getElementById('directionSelect');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const lineHeightSlider = document.getElementById('lineHeightSlider');
        const lineHeightDisplay = document.getElementById('lineHeightDisplay');
        const bgOpacitySlider = document.getElementById('bgOpacitySlider');
        const bgOpacityDisplay = document.getElementById('bgOpacityDisplay');
        const bgImageInput = document.getElementById('bgImageInput');
        const readerBgLayer = document.getElementById('readerBgLayer');
        const btnDarkMode = document.getElementById('btnDarkMode');
        const btnSync = document.getElementById('btnSync');

        const epubViewer = document.getElementById('epubViewer');
        const txtViewer = document.getElementById('txtViewer');
        const txtContent = document.getElementById('txtContent');

        const btnPrevPage = document.getElementById('btnPrevPage');
        const btnNextPage = document.getElementById('btnNextPage');
        const pageInfo = document.getElementById('pageInfo');
        const toastMessage = document.getElementById('toastMessage');

        // 畫線顏色對照表（方便推理小說分類）
        const HIGHLIGHT_COLORS = [
            { code: '#FFB6C1', name: '粉紅' },
            { code: '#FFFF00', name: '黃' },
            { code: '#FFA500', name: '橘' },
            { code: '#90EE90', name: '綠' },
            { code: '#ADD8E6', name: '藍' },
            { code: '#DDA0DD', name: '紫' }
        ];

        // === 全域狀態 ===
        const state = {
            mode: null, // 'txt' | 'epub'
            fontSize: 24,
            lineHeight: 1.8,
            fontFamily: 'inherit',
            direction: 'horizontal', // 'horizontal' | 'vertical'
            isDarkMode: false,
            bgOpacity: 16,
            customBgDataUrl: null,
            txtContent: '',
            currentFile: 'default',
            txtPage: 0,
            txtTotalPages: 1,
            epubCfi: null,
            activeHighlightFilter: 'all', // 'all' | color code
            bookmarksByBook: {},
            highlightsByBook: {}
        };

        // EPUB 執行階段狀態
        let book = null;
        let rendition = null;
        let epubLocations = [];
        let epubLocationsFailed = false;
        let currentBookToken = 0;
        let selectedCfi = null;
        let selectedEpubText = '';
        let epubResizeTimer = null;
        let isEpubNavigating = false;
        let epubEngineReady = false;
        let epubEngineSource = 'loading';

        // 自訂字體暫存清單
        const customFonts = [];

        // Firebase 選配狀態
        let firebaseApi = null;
        let db = null;
        let currentUser = null;
        let currentAppId = 'eink-reader-default';

        // === Toast 提示 ===
        let toastTimer = null;
        function showToast(msg, duration = 3000) {
            toastMessage.textContent = msg;
            toastMessage.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastMessage.classList.add('hidden');
            }, duration);
        }

        // === 1. 離線優先雙重腳本載入器 ===
        function loadScriptUrl(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = false;
                script.onload = () => resolve(src);
                script.onerror = () => {
                    script.remove();
                    reject(new Error('Failed to load ' + src));
                };
                document.head.appendChild(script);
            });
        }

        async function loadScriptWithFallback(localPath, cdnUrl) {
            try {
                await loadScriptUrl(localPath);
                return 'local';
            } catch {
                if (navigator.onLine) {
                    await loadScriptUrl(cdnUrl);
                    return 'cdn';
                }
                throw new Error('Offline and local library missing: ' + localPath);
            }
        }

        async function initOfflineEpubEngine() {
            try {
                const zipSrc = typeof window.JSZip !== 'undefined'
                    ? 'local'
                    : await loadScriptWithFallback(
                        './libs/jszip.min.js',
                        'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
                    );

                const epubSrc = typeof window.ePub !== 'undefined'
                    ? 'local'
                    : await loadScriptWithFallback(
                        './libs/epub.min.js',
                        'https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js'
                    );

                epubEngineReady = (typeof window.JSZip !== 'undefined' && typeof window.ePub !== 'undefined');
                epubEngineSource = (zipSrc === 'local' && epubSrc === 'local') ? 'local' : 'cdn';

                if (epubEngineSource === 'local') {
                    engineStatusBadge.textContent = '離線狀態：本機 EPUB 引擎已就緒（免 Wi-Fi）';
                } else {
                    engineStatusBadge.textContent = '引擎狀態：雲端備援模式（離線請放置 libs 資料夾）';
                }
            } catch {
                epubEngineReady = false;
                epubEngineSource = 'failed';
                engineStatusBadge.textContent = '離線提示：TXT 可用，EPUB 需放置 libs 檔案或連線';
            }
        }

        // 取得雲端字體 CSS（分開宣告，避免單一字體失敗影響其他字體）
        function getCloudFontsCss() {
            return `
                @import url('https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@400;700&display=swap');
                @font-face {
                    font-family: 'Iansui';
                    src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/iansui@master/Iansui-Regular.ttf') format('truetype');
                    font-display: swap;
                }
                @font-face {
                    font-family: 'Bpmf Iansui';
                    src: url('https://cdn.jsdelivr.net/gh/ButTaiwan/bpmfvs@master/fonts/BpmfIansui-Regular.ttf') format('truetype');
                    font-display: swap;
                }
                @font-face {
                    font-family: 'LINE Seed TW';
                    src: url('https://cdn.jsdelivr.net/gh/Lukas-W/font-logos@master/assets/font-logos.woff2') format('woff2');
                    font-display: swap;
                }
                @font-face {
                    font-family: 'JasonHandwriting1';
                    src: url('https://cdn.jsdelivr.net/gh/max32002/JasonHandWritingFonts@20240409/webfont/JasonHandwriting1-Regular.woff2') format('woff2');
                    font-display: swap;
                }
            `;
        }

        function loadOptionalCloudFonts() {
            if (!navigator.onLine) return;
            const style = document.createElement('style');
            style.id = 'eink-optional-cloud-fonts';
            style.textContent = getCloudFontsCss();
            document.head.appendChild(style);
        }

        function registerServiceWorker() {
            if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            }
        }

        function applyBackgroundLayerUI() {
            if (state.customBgDataUrl) {
                readerBgLayer.style.backgroundImage = `url("${state.customBgDataUrl}")`;
            }
            if (state.isDarkMode) {
                readerBgLayer.style.opacity = '0';
            } else {
                readerBgLayer.style.opacity = String((state.bgOpacity || 0) / 100);
            }
        }

        // === 2. IndexedDB 自訂字體離線永久儲存 ===
        const FONT_DB_NAME = 'EInkReaderFontsDB';
        const FONT_STORE_NAME = 'fonts';

        function openFontDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject(new Error('No IndexedDB'));
                const req = indexedDB.open(FONT_DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const idb = e.target.result;
                    if (!idb.objectStoreNames.contains(FONT_STORE_NAME)) {
                        idb.createObjectStore(FONT_STORE_NAME, { keyPath: 'familyName' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveFontToIndexedDB(fontEntry) {
            try {
                const idb = await openFontDB();
                const tx = idb.transaction(FONT_STORE_NAME, 'readwrite');
                tx.objectStore(FONT_STORE_NAME).put(fontEntry);
            } catch {}
        }

        async function restoreSavedFontsFromIndexedDB() {
            try {
                const idb = await openFontDB();
                const tx = idb.transaction(FONT_STORE_NAME, 'readonly');
                const store = tx.objectStore(FONT_STORE_NAME);
                const allFonts = await new Promise((resolve, reject) => {
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });

                for (const entry of allFonts) {
                    if (!entry || !entry.familyName || !entry.buffer) continue;
                    try {
                        const face = new FontFace(entry.familyName, entry.buffer.slice(0));
                        await face.load();
                        document.fonts.add(face);
                        customFonts.push(entry);

                        const optionValue = `'${entry.familyName}', sans-serif`;
                        if (![...fontSelect.options].some(o => o.value === optionValue)) {
                            const opt = document.createElement('option');
                            opt.value = optionValue;
                            opt.textContent = `[自訂] ${entry.displayName || entry.familyName}`;
                            fontSelect.appendChild(opt);
                        }
                    } catch {}
                }

                if ([...fontSelect.options].some(o => o.value === state.fontFamily)) {
                    fontSelect.value = state.fontFamily;
                    applyStyles();
                }
            } catch {}
        }

        // === 3. 本機儲存與選配 Firebase 雲端同步 ===
        function getLocalStorageKey() {
            return 'eink_reader_state_v2';
        }

        function saveLocalSettings() {
            try {
                const payload = {
                    fontSize: state.fontSize,
                    lineHeight: state.lineHeight,
                    fontFamily: state.fontFamily,
                    direction: state.direction,
                    isDarkMode: state.isDarkMode,
                    bgOpacity: state.bgOpacity,
                    customBgDataUrl: state.customBgDataUrl,
                    bookmarksByBook: state.bookmarksByBook,
                    highlightsByBook: state.highlightsByBook
                };
                localStorage.setItem(getLocalStorageKey(), JSON.stringify(payload));
            } catch {}
        }

        function loadLocalSettings() {
            try {
                const raw = localStorage.getItem(getLocalStorageKey());
                if (!raw) return;
                applySavedSettingsData(JSON.parse(raw));
            } catch {}
        }

        function applySavedSettingsData(data) {
            if (!data) return;
            if (typeof data.fontSize === 'number') state.fontSize = data.fontSize;
            if (typeof data.lineHeight === 'number') state.lineHeight = data.lineHeight;
            if (typeof data.fontFamily === 'string') state.fontFamily = data.fontFamily;
            if (data.direction === 'horizontal' || data.direction === 'vertical') state.direction = data.direction;
            if (typeof data.isDarkMode === 'boolean') state.isDarkMode = data.isDarkMode;
            if (typeof data.bgOpacity === 'number') state.bgOpacity = data.bgOpacity;
            if (typeof data.customBgDataUrl === 'string') state.customBgDataUrl = data.customBgDataUrl;
            if (data.bookmarksByBook && typeof data.bookmarksByBook === 'object') {
                state.bookmarksByBook = data.bookmarksByBook;
            }
            if (data.highlightsByBook && typeof data.highlightsByBook === 'object') {
                state.highlightsByBook = data.highlightsByBook;
            }

            fontSizeSlider.value = state.fontSize;
            fontSizeDisplay.textContent = `${state.fontSize}px`;
            lineHeightSlider.value = state.lineHeight;
            lineHeightDisplay.textContent = state.lineHeight.toFixed(1);
            bgOpacitySlider.value = state.bgOpacity;
            bgOpacityDisplay.textContent = `${state.bgOpacity}%`;
            directionSelect.value = state.direction;

            if ([...fontSelect.options].some(o => o.value === state.fontFamily)) {
                fontSelect.value = state.fontFamily;
            } else {
                state.fontFamily = 'inherit';
                fontSelect.value = 'inherit';
            }

            applyDarkModeUI();
            applyBackgroundLayerUI();
            applyStyles();
            renderBookmarks();
            renderHighlightSummary();
        }

        async function initOptionalFirebase() {
            loadLocalSettings();
            if (!navigator.onLine) return;

            const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            if (typeof __app_id !== 'undefined' && __app_id) currentAppId = __app_id;
            if (!rawConfig) return;

            try {
                const [appMod, authMod, fsMod] = await Promise.all([
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
                ]);

                const firebaseConfig = typeof rawConfig === 'string' ? JSON.parse(rawConfig) : rawConfig;
                const app = appMod.initializeApp(firebaseConfig);
                const auth = authMod.getAuth(app);
                db = fsMod.getFirestore(app);
                firebaseApi = fsMod;

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await authMod.signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = cred.user;
                } else {
                    const cred = await authMod.signInAnonymously(auth);
                    currentUser = cred.user;
                }

                const docRef = firebaseApi.doc(db, 'artifacts', currentAppId, 'users', currentUser.uid, 'settings', 'readerData');
                const snap = await firebaseApi.getDoc(docRef);
                if (snap.exists()) {
                    applySavedSettingsData(snap.data());
                }
            } catch {}
        }

        function normalizeCloudUrl(rawUrl) {
            const trimmed = rawUrl.trim();
            const gdriveMatch = trimmed.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (gdriveMatch) {
                return `https://drive.google.com/uc?export=download&id=${gdriveMatch[1]}`;
            }
            const gdriveIdMatch = trimmed.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
            if (gdriveIdMatch) {
                return `https://drive.google.com/uc?export=download&id=${gdriveIdMatch[1]}`;
            }
            if (trimmed.includes('dropbox.com')) {
                return trimmed.replace(/[?&]dl=0/, '?dl=1');
            }
            return trimmed;
        }

        function isZipOrEpubBuffer(buffer) {
            if (!buffer || buffer.byteLength < 4) return false;
            const bytes = new Uint8Array(buffer, 0, 4);
            return bytes[0] === 0x50 && bytes[1] === 0x4B;
        }

        function looksLikeHtmlPage(buffer) {
            try {
                const sample = new TextDecoder('utf-8').decode(buffer.slice(0, 512)).trim().toLowerCase();
                return sample.startsWith('<!doctype html') || sample.startsWith('<html') || sample.includes('<head>');
            } catch {
                return false;
            }
        }

        async function fetchCloudArrayBuffer(targetUrl) {
            const candidates = [
                targetUrl,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            for (const url of candidates) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const buffer = await res.arrayBuffer();
                    if (buffer && buffer.byteLength > 0 && !looksLikeHtmlPage(buffer)) {
                        return buffer;
                    }
                } catch {}
            }
            return null;
        }

            const rawUrl = cloudFileUrl.value.trim();
