<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#EFEBF5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>E-Ink 專屬電子書閱讀器 (莫蘭迪藍紫極速離線版)</title>
    <!-- PWA Manifest (於網頁伺服器環境生效) -->
    <link rel="manifest" href="./manifest.json">

    <style>
        /* =========================================================
           100% 離線內建樣式：淡色系莫蘭迪藍紫風格（兼顧電子紙清晰度）
           ========================================================= */
        :root {
            --bg: #F8F7FB;
            --surface: #EFEBF6;
            --surface-soft: #F4F1FA;
            --surface-hover: #E1DBEE;
            --accent: #7F86AD;
            --accent-strong: #5E658C;
            --fg: #2B2D40;
            --border: #9CA1BE;
            --border-strong: #7F86AD;
            --muted: #707491;
            --overlay: rgba(245, 243, 250, 0.90);
            --btn-active-bg: #6B7299;
            --btn-active-fg: #FFFFFF;
        }

        html.dark {
            --bg: #0E0F17;
            --surface: #171926;
            --surface-soft: #1D2030;
            --surface-hover: #2A2E45;
            --accent: #9AA2CC;
            --accent-strong: #B6BDE0;
            --fg: #F2F3F9;
            --border: #555B7A;
            --border-strong: #8B92B8;
            --muted: #A9AFC9;
            --overlay: rgba(14, 15, 23, 0.92);
            --btn-active-bg: #D8DCF0;
            --btn-active-fg: #12141F;
        }

        /* 保留電子紙友善設計：移除過場動畫與重陰影，避免殘影 */
        * {
            box-sizing: border-box;
            transition: none !important;
            animation: none !important;
            box-shadow: none !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "LINE Seed TW", "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            border: 4px solid var(--border-strong);
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .hidden {
            display: none !important;
        }

        /* 通用按鈕與表單元件 */
        .eink-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 2px solid var(--border-strong);
            border-radius: 6px;
            background-color: var(--bg);
            color: var(--fg);
            padding: 6px 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            user-select: none;
        }

        .eink-btn:hover {
            background-color: var(--surface-hover);
        }

        .eink-btn:active,
        .eink-btn.active-btn {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
            border-color: var(--accent-strong);
        }

        .eink-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .eink-btn-full {
            width: 100%;
            padding: 10px 12px;
        }

        .eink-select,
        .eink-input {
            width: 100%;
            border: 2px solid var(--border-strong);
            border-radius: 6px;
            background-color: var(--bg);
            color: var(--fg);
            padding: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        /* 頂部工具列 */
        .app-header {
            border-bottom: 3px solid var(--border-strong);
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
            z-index: 30;
            background-color: var(--surface);
            position: relative;
        }

        .header-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .dropdown-anchor {
            position: relative;
        }

        /* 雲端匯入下拉選單 */
        .cloud-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 224px;
            background-color: var(--bg);
            border: 3px solid var(--border-strong);
            border-radius: 8px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cloud-menu button {
            text-align: left;
            padding: 10px 12px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--fg);
            cursor: pointer;
        }

        .cloud-menu button:last-child {
            border-bottom: none;
        }

        .cloud-menu button:hover {
            background-color: var(--surface-hover);
        }

        .cloud-menu button:active {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
        }

        /* 畫線註記浮動選單 */
        .highlight-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background-color: var(--surface-soft);
            border: 3px solid var(--border-strong);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
            min-width: 270px;
        }

        .highlight-swatches-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .highlight-actions-row {
            display: flex;
            gap: 8px;
        }

        .highlight-actions-row .eink-btn {
            flex: 1;
            font-size: 14px;
            padding: 7px 8px;
        }

        .color-btn {
            width: 34px;
            height: 34px;
            border: 2px solid var(--accent-strong);
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
        }

        .bookmark-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
        }

        html.dark .bookmark-img {
            filter: invert(1);
        }

        /* 主容器與側邊欄 */
        .app-body {
            flex: 1;
            min-height: 0;
            display: flex;
            position: relative;
            overflow: hidden;
            background-color: var(--bg);
        }

        .sidebar {
            position: absolute;
            top: 0;
            height: 100%;
            width: 82%;
            max-width: 340px;
            background-color: var(--surface-soft);
            z-index: 25;
            display: flex;
            flex-direction: column;
        }

        .sidebar-left {
            left: 0;
            border-right: 3px solid var(--border-strong);
        }

        .sidebar-right {
            right: 0;
            border-left: 3px solid var(--border-strong);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 3px solid var(--border-strong);
            background-color: var(--surface);
        }

        .sidebar-title {
            margin: 0;
            font-size: 19px;
            font-weight: 700;
            color: var(--accent-strong);
        }

        .sidebar-action-bar {
            padding: 12px;
            border-bottom: 2px solid var(--border);
            background-color: var(--surface-soft);
        }

        .sidebar-content {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-list {
            list-style: none;
            margin: 0;
            padding: 12px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-weight: 700;
        }

        .muted-text {
            color: var(--muted);
            font-weight: 700;
            font-size: 14px;
            line-height: 1.5;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent-strong);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .range-slider {
            width: 100%;
            height: 24px;
            accent-color: var(--accent-strong);
        }

        .toc-item-btn {
            width: 100%;
            text-align: left;
            padding: 10px 8px;
            border: none;
            border-bottom: 1px solid var(--border);
            background-color: transparent;
            color: var(--fg);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .toc-item-btn:hover {
            background-color: var(--surface-hover);
        }

        .toc-item-btn:active {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
        }

        .bookmark-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .bookmark-jump-btn {
            flex: 1;
            min-width: 0;
            text-align: left;
            padding: 6px 4px;
            border: none;
            background-color: transparent;
            color: var(--fg);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-jump-btn:hover {
            background-color: var(--surface-hover);
        }

        .bookmark-del-btn {
            border: 2px solid var(--border-strong);
            border-radius: 4px;
            background-color: var(--bg);
            color: var(--fg);
            padding: 4px 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .bookmark-del-btn:active {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
        }

        /* 畫線註記統整：顏色篩選列與項目卡片 */
        .hl-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .hl-filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 9px;
            border: 2px solid var(--border-strong);
            border-radius: 999px;
            background-color: var(--bg);
            color: var(--fg);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .hl-filter-chip.active-chip {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
            border-color: var(--accent-strong);
        }

        .hl-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #333333;
            display: inline-block;
            flex-shrink: 0;
        }

        .hl-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 2px solid var(--border);
            border-left-width: 8px;
            border-radius: 6px;
            background-color: var(--bg);
            padding: 10px;
        }

        .hl-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .hl-card-text-btn {
            width: 100%;
            text-align: left;
            border: none;
            background-color: transparent;
            color: var(--fg);
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
            padding: 2px 0;
            cursor: pointer;
            word-break: break-word;
        }

        .hl-card-text-btn:hover {
            text-decoration: underline;
        }

        /* 閱讀主畫面 + 極淡紫花瓣白布紋背景 */
        .reader-main {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 10px 20px;
            overflow: hidden;
            background-color: var(--bg);
        }

        .reader-bg-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 0.16;
            background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 900'%3E%3Cdefs%3E%3CradialGradient id='cloth' cx='50%25' cy='45%25' r='70%25'%3E%3Cstop offset='0%25' stop-color='%23FFFFFF'/%3E%3Cstop offset='65%25' stop-color='%23F4F1FA'/%3E%3Cstop offset='100%25' stop-color='%23E7E3F3'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='1200' height='900' fill='url(%23cloth)'/%3E%3Cpath d='M0 240 Q320 190 640 250 T1200 220' fill='none' stroke='%23DCD7EB' stroke-width='28' opacity='0.35'/%3E%3Cpath d='M0 620 Q360 680 740 600 T1200 660' fill='none' stroke='%23E0DCF0' stroke-width='36' opacity='0.35'/%3E%3Cg opacity='0.78'%3E%3Cellipse cx='150' cy='140' rx='26' ry='14' transform='rotate(-28 150 140)' fill='%238E85C2'/%3E%3Cellipse cx='192' cy='168' rx='20' ry='11' transform='rotate(32 192 168)' fill='%23A9A1D6'/%3E%3Cellipse cx='126' cy='182' rx='18' ry='10' transform='rotate(-65 126 182)' fill='%237D8AC0'/%3E%3Cellipse cx='1040' cy='125' rx='24' ry='13' transform='rotate(24 1040 125)' fill='%239389C7'/%3E%3Cellipse cx='1082' cy='160' rx='18' ry='10' transform='rotate(-38 1082 160)' fill='%23B4ADD9'/%3E%3Cellipse cx='985' cy='170' rx='16' ry='9' transform='rotate(58 985 170)' fill='%238391C7'/%3E%3Cellipse cx='210' cy='760' rx='28' ry='14' transform='rotate(18 210 760)' fill='%239188C4'/%3E%3Cellipse cx='158' cy='720' rx='19' ry='10' transform='rotate(-44 158 720)' fill='%23B0A8D9'/%3E%3Cellipse cx='265' cy='790' rx='16' ry='9' transform='rotate(-15 265 790)' fill='%237E8BC2'/%3E%3Cellipse cx='1020' cy='760' rx='26' ry='13' transform='rotate(-22 1020 760)' fill='%238B82BF'/%3E%3Cellipse cx='1075' cy='722' rx='21' ry='11' transform='rotate(36 1075 722)' fill='%23A79FD4'/%3E%3Cellipse cx='970' cy='795' rx='17' ry='9' transform='rotate(12 970 795)' fill='%237F8EC4'/%3E%3Cellipse cx='590' cy='95' rx='18' ry='9' transform='rotate(15 590 95)' fill='%23A9A2D4'/%3E%3Cellipse cx='645' cy='815' rx='20' ry='10' transform='rotate(-20 645 815)' fill='%239C94CC'/%3E%3Cellipse cx='95' cy='460' rx='19' ry='10' transform='rotate(48 95 460)' fill='%239F97CF'/%3E%3Cellipse cx='1115' cy='445' rx='21' ry='11' transform='rotate(-52 1115 445)' fill='%238E96C9'/%3E%3C/g%3E%3C/svg%3E");
        }

        html.dark .reader-bg-layer {
            opacity: 0;
        }

        #epubViewer,
        #txtViewer {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        /* 禁止 EPUB 容器在直排模式下產生垂直捲動 */
        #epubViewer .epub-container {
            overflow-y: hidden !important;
        }

        /* TXT 單頁分頁容器 */
        #txtViewer {
            scroll-behavior: auto;
        }

        #txtContent {
            height: 100%;
            column-gap: 0;
            column-fill: auto;
            word-break: break-word;
            text-align: justify;
            white-space: pre-wrap;
            font-size: 24px;
            line-height: 1.8;
            font-family: inherit;
            background-color: transparent;
            user-select: text;
            -webkit-user-select: text;
        }

        /* TXT 直排模式（由右至左） */
        #txtViewer.vertical-mode #txtContent {
            writing-mode: vertical-rl;
            -webkit-writing-mode: vertical-rl;
            column-width: auto !important;
            width: auto;
            min-width: 100%;
            height: 100%;
        }

        .highlight-bg {
            color: #1F2030 !important;
            padding: 0 2px;
            border-radius: 2px;
        }

        /* 底部控制列 */
        .app-footer {
            height: 60px;
            border-top: 3px solid var(--border-strong);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            background-color: var(--surface);
        }

        .page-btn {
            height: 100%;
            padding: 0 24px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            background-color: var(--surface);
            color: var(--fg);
            cursor: pointer;
            white-space: nowrap;
        }

        .page-btn:hover {
            background-color: var(--surface-hover);
        }

        .page-btn-prev {
            border-right: 3px solid var(--border-strong);
        }

        .page-btn-next {
            border-left: 3px solid var(--border-strong);
        }

        .page-btn:active {
            background-color: var(--btn-active-bg);
            color: var(--btn-active-fg);
        }

        .page-info {
            font-weight: 700;
            font-size: 15px;
            padding: 0 12px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--accent-strong);
        }

        /* 雲端匯入視窗 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--overlay);
            padding: 16px;
        }

        .modal-box {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg);
            border: 3px solid var(--border-strong);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }

        .modal-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-strong);
        }

        .modal-desc {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.6;
        }

        .modal-status {
            border: 2px solid var(--border-strong);
            border-radius: 6px;
            background-color: var(--surface-soft);
            padding: 8px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }

        .modal-status a {
            color: var(--accent-strong);
            text-decoration: underline;
        }

        .modal-divider {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 10px;
            border-top: 2px solid var(--border);
        }

        /* 離線狀態徽章 */
        .offline-badge {
            font-size: 12px;
            border: 2px solid var(--border-strong);
            border-radius: 6px;
            background-color: var(--bg);
            color: var(--accent-strong);
            padding: 6px 8px;
            font-weight: 700;
            text-align: center;
        }

        /* 狀態提示列 */
        .toast-box {
            position: fixed;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            background-color: var(--accent-strong);
            color: #FFFFFF;
            border: 2px solid var(--border-strong);
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 15px;
            max-width: 90vw;
            text-align: center;
        }

        @media (min-width: 768px) {
            .reader-main {
                padding: 12px 36px;
            }
            .page-btn {
                padding: 0 44px;
            }
        }
    </style>
</head>
<body>

    <!-- 頂部工具列 -->
    <header class="app-header">
        <div class="header-group">
            <!-- 移除 accept 限制，避免 Android 系統檔案選擇器將 .txt / .epub 反灰無法點選 -->
            <label class="eink-btn">
                匯入書籍(EPUB/TXT)
                <input type="file" id="fileInput" class="hidden">
            </label>

            <div class="dropdown-anchor">
                <button id="btnCloudImport" type="button" class="eink-btn">
                    從雲端匯入
                </button>
                <div id="cloudImportMenu" class="cloud-menu hidden">
                    <button type="button" class="cloud-source-btn" data-provider="google">1. Google雲端</button>
                    <button type="button" class="cloud-source-btn" data-provider="mega">2. Mega雲端</button>
                    <button type="button" class="cloud-source-btn" data-provider="readmoo">3. Readmoo 讀墨</button>
                    <button type="button" class="cloud-source-btn" data-provider="kobo">4. Kobo</button>
                    <button type="button" class="cloud-source-btn" data-provider="kindle">5. Kindle</button>
                    <button type="button" class="cloud-source-btn" data-provider="hyread">6. HyRead 個人書房</button>
                    <button type="button" class="cloud-source-btn" data-provider="boox">7. 文石雲端</button>
                </div>
            </div>

            <button id="btnToggleTOC" type="button" class="eink-btn">
                選擇章節
            </button>
        </div>

        <div class="header-group">
            <button id="btnToggleHighlight" type="button" class="eink-btn">
                畫線註記
            </button>

            <button id="btnToggleBookmarks" type="button" class="eink-btn">
                <img src="bookmark_2.png" class="bookmark-icon bookmark-img" alt="書籤" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                <svg class="bookmark-icon hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M5 3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v19l-7-4-7 4V3z"/>
                </svg>
                <span>書籤</span>
            </button>

            <button id="btnToggleFonts" type="button" class="eink-btn">
                字體
            </button>

            <button id="btnToggleSettings" type="button" class="eink-btn">
                閱讀設定

                const ch = text[i];
                if (mode === 's2t') {
                    if (ch === '“') { out += '「'; continue; }
                    if (ch === '”') { out += '」'; continue; }
                    if (ch === '‘') { out += '『'; continue; }
                    if (ch === '’') { out += '』'; continue; }

                    if (ch === '」') { out += '”'; continue; }
                    if (ch === '『') { out += '‘'; continue; }
                    if (ch === '』') { out += '’'; continue; }
                }
                out += map.get(ch) || ch;

            return out;

        // === 1. 離線優先雙重腳本載入器 ===
        function loadScriptUrl(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = false;
                script.onload = () => resolve(src);
                script.onerror = () => {
                    script.remove();
                    reject(new Error('Failed to load ' + src));
                };
                document.head.appendChild(script);
            });
        }

        async function loadScriptWithFallback(localPath, cdnUrl) {
            try {
                await loadScriptUrl(localPath);
                return 'local';
            } catch {
                if (navigator.onLine) {
                    await loadScriptUrl(cdnUrl);
                    return 'cdn';
                }
                throw new Error('Offline and local library missing: ' + localPath);
            }
        }

        // === 2. IndexedDB 自訂字體離線永久儲存（Blob URL 輕量化） ===
        const FONT_DB_NAME = 'EInkReaderFontsDB';
        const FONT_STORE_NAME = 'fonts';

        function openFontDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject(new Error('No IndexedDB'));
                const req = indexedDB.open(FONT_DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const idb = e.target.result;
                    if (!idb.objectStoreNames.contains(FONT_STORE_NAME)) {
                        idb.createObjectStore(FONT_STORE_NAME, { keyPath: 'familyName' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveFontToIndexedDB(fontEntry) {
            try {
                const idb = await openFontDB();
                const tx = idb.transaction(FONT_STORE_NAME, 'readwrite');
                tx.objectStore(FONT_STORE_NAME).put({
                    familyName: fontEntry.familyName,
                    displayName: fontEntry.displayName,
                    buffer: fontEntry.buffer
                });
            } catch {}
        }

        function registerCustomFontBlob(entry) {
            if (!entry.blobUrl && entry.buffer) {
                entry.blobUrl = URL.createObjectURL(new Blob([entry.buffer], { type: 'font/ttf' }));
            }
            return entry;
        }

        async function restoreSavedFontsFromIndexedDB() {
            try {
                const idb = await openFontDB();
                const tx = idb.transaction(FONT_STORE_NAME, 'readonly');
                const store = tx.objectStore(FONT_STORE_NAME);
                const allFonts = await new Promise((resolve, reject) => {
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });

                for (const entry of allFonts) {
                    if (!entry || !entry.familyName || !entry.buffer) continue;
                    try {
                        registerCustomFontBlob(entry);
                        const face = new FontFace(entry.familyName, `url(${entry.blobUrl})`);
                        await face.load();
                        document.fonts.add(face);
                        customFonts.push({
                            familyName: entry.familyName,
                            displayName: entry.displayName,
                            blobUrl: entry.blobUrl
                        });

                        const optionValue = `'${entry.familyName}', sans-serif`;
                        if (![...fontSelect.options].some(o => o.value === optionValue)) {
                            const opt = document.createElement('option');
                            opt.value = optionValue;
                            opt.textContent = `[自訂] ${entry.displayName || entry.familyName}`;
                            fontSelect.appendChild(opt);
                        }
                    } catch {}
                }

                if ([...fontSelect.options].some(o => o.value === state.fontFamily)) {
                    fontSelect.value = state.fontFamily;
                    applyStyles();
                }
            } catch {}
        }

        async function initOptionalFirebase() {
            loadLocalSettings();
            if (!navigator.onLine) return;

            const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            if (typeof __app_id !== 'undefined' && __app_id) currentAppId = __app_id;
            if (!rawConfig) return;

            try {
                const [appMod, authMod, fsMod] = await Promise.all([
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
                    import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
                ]);

                const firebaseConfig = typeof rawConfig === 'string' ? JSON.parse(rawConfig) : rawConfig;
                const app = appMod.initializeApp(firebaseConfig);
                const auth = authMod.getAuth(app);
                db = fsMod.getFirestore(app);
                firebaseApi = fsMod;

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await authMod.signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = cred.user;
                } else {

                    currentUser = cred.user;

                const docRef = firebaseApi.doc(db, 'artifacts', currentAppId, 'users', currentUser.uid, 'settings', 'readerData');
                const snap = await firebaseApi.getDoc(docRef);
                if (snap.exists()) {
                    applySavedSettingsData(snap.data());
                }
            } catch {}
        }

        function normalizeCloudUrl(rawUrl) {
            const trimmed = rawUrl.trim();
            const gdriveMatch = trimmed.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (gdriveMatch) {
                return `https://drive.google.com/uc?export=download&id=${gdriveMatch[1]}`;
            }
            const gdriveIdMatch = trimmed.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
            if (gdriveIdMatch) {
                return `https://drive.google.com/uc?export=download&id=${gdriveIdMatch[1]}`;
            }
            if (trimmed.includes('dropbox.com')) {
                return trimmed.replace(/[?&]dl=0/, '?dl=1');
            }
            return trimmed;
        }

        function isZipOrEpubBuffer(buffer) {
            if (!buffer || buffer.byteLength < 4) return false;
            const bytes = new Uint8Array(buffer, 0, 4);
            return bytes[0] === 0x50 && bytes[1] === 0x4B;
        }

        function looksLikeHtmlPage(buffer) {
            try {
                const sample = new TextDecoder('utf-8').decode(buffer.slice(0, 512)).trim().toLowerCase();
                return sample.startsWith('<!doctype html') || sample.startsWith('<html') || sample.includes('<head>');
            } catch {
                return false;
            }
        }

        function scoreDecodedChineseText(text) {
            if (!text || text.length === 0) return -1e9;
            let score = 0;
            const len = Math.min(text.length, 24000);
            let replacementCount = 0;
            let controlCount = 0;

            for (let i = 0; i < len; i++) {
                const ch = text[i];
                const code = ch.charCodeAt(0);

                if (code === 0xFFFD) {
                    replacementCount++;
                    score -= 45;
                    continue;
                }
                if (code === 0x00 || (code < 0x20 && code !== 0x09 && code !== 0x0A && code !== 0x0D)) {
                    controlCount++;
                    score -= 30;
                    continue;
                }
                if (COMMON_CJK_PUNCT.has(ch)) {
                    score += 8;
                } else if (COMMON_CJK_CHARS.has(ch)) {
                    score += 6;
                } else if (code >= 0x4E00 && code <= 0x9FFF) {
                    // 一般常用區漢字（較生僻漢字給小幅正分，避免誤判的亂碼漢字得分過高）
                    score += 0.5;
                } else if ((code >= 0x3040 && code <= 0x30FF)) {
                    // 日文假名
                    score += 3;
                } else if (code >= 0x20 && code <= 0x7E) {
                    score += 0.3;
                } else if (code >= 0xE000 && code <= 0xF8FF) {
                    // 私用區字元通常是誤解碼產物
                    score -= 12;
                }
            }

            if (replacementCount > len * 0.03) score -= 5000;
            if (controlCount > len * 0.02) score -= 5000;
            return score;
        }

        function detectBomEncoding(bytes) {
            if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
                return 'utf-8';
            }
            if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
                return 'utf-16le';
            }
            if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
                return 'utf-16be';
            }
            return null;
        }

        function detectUtf16WithoutBom(bytes) {
            const sampleLen = Math.min(bytes.length, 4096);
            if (sampleLen < 16) return null;
            let zeroEven = 0;
            let zeroOdd = 0;
            for (let i = 0; i < sampleLen; i++) {
                if (bytes[i] === 0x00) {
                    if (i % 2 === 0) zeroEven++;
                    else zeroOdd++;
                }
            }
            const totalPairs = sampleLen / 2;
            if (zeroOdd > totalPairs * 0.25 && zeroEven < totalPairs * 0.08) return 'utf-16le';
            if (zeroEven > totalPairs * 0.25 && zeroOdd < totalPairs * 0.08) return 'utf-16be';
            return null;
        }

        function decodeTextBufferSmart(buffer, forcedEncoding = 'auto') {
            if (!buffer) return { text: '', encoding: 'utf-8' };

            const cleanEncoding = (forcedEncoding || 'auto').toLowerCase();
            if (cleanEncoding !== 'auto') {
                try {
                    const text = new TextDecoder(cleanEncoding).decode(buffer).replace(/^\uFEFF/, '');
                    return { text, encoding: cleanEncoding };
                } catch {}
            }

            const bytes = new Uint8Array(buffer);

            // 1. 優先檢查 BOM 標頭
            const bomEnc = detectBomEncoding(bytes);
            if (bomEnc) {
                try {
                    const text = new TextDecoder(bomEnc).decode(buffer).replace(/^\uFEFF/, '');
                    return { text, encoding: bomEnc };
                } catch {}
            }

            // 2. 檢查無 BOM 的 UTF-16LE / UTF-16BE
            const utf16Guess = detectUtf16WithoutBom(bytes);
            if (utf16Guess) {
                try {
                    const text = new TextDecoder(utf16Guess).decode(buffer).replace(/^\uFEFF/, '');
                    return { text, encoding: utf16Guess };
                } catch {}
            }

            // 3. 嚴格檢查是否為合法 UTF-8
            try {
                const strictUtf8 = new TextDecoder('utf-8', { fatal: true }).decode(buffer).replace(/^\uFEFF/, '');
                return { text: strictUtf8, encoding: 'utf-8' };
            } catch {}

            // 4. 非嚴格 UTF-8 時，針對前 32KB 進行多編碼評分（精準區分 GB18030 簡體、Big5 繁體、UTF-8 容錯、Shift_JIS）
            const sampleBuffer = buffer.byteLength > 32768 ? buffer.slice(0, 32768) : buffer;
            const candidates = ['gb18030', 'big5', 'utf-8', 'shift_jis', 'utf-16le'];
            let bestEncoding = 'gb18030';
            let bestScore = -Infinity;

            for (const enc of candidates) {
                try {
                    const sampleText = new TextDecoder(enc).decode(sampleBuffer);
                    const score = scoreDecodedChineseText(sampleText);
                    if (score > bestScore) {
                        bestScore = score;
                        bestEncoding = enc;
                    }
                } catch {}
            }

            try {
                const fullText = new TextDecoder(bestEncoding).decode(buffer).replace(/^\uFEFF/, '');
                return { text: fullText, encoding: bestEncoding };
            } catch {
                return { text: new TextDecoder('utf-8').decode(buffer).replace(/^\uFEFF/, ''), encoding: 'utf-8' };
            }
        }

        function formatEncodingLabel(enc) {
            const map = {
                'utf-8': 'UTF-8',
                'big5': 'Big5 (繁體)',
                'gb18030': 'GB18030 / GBK (簡體)',
                'utf-16le': 'UTF-16LE',
                'utf-16be': 'UTF-16BE',
                'shift_jis': 'Shift_JIS'
            };
            return map[(enc || '').toLowerCase()] || enc.toUpperCase();
        }

            for (const url of candidates) {

                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const buffer = await res.arrayBuffer();
                    if (buffer && buffer.byteLength > 0 && !looksLikeHtmlPage(buffer)) {
                        return buffer;
                    }
                } catch {}
            }
            return null;
        }

        // === 極速按需解壓輔助工具（針對 30MB+ 大型 EPUB） ===
        function clearLazyMediaCache() {
            lazyMediaCache.forEach(url => {
                try { URL.revokeObjectURL(url); } catch {}
            });
            lazyMediaCache.clear();
            zipExactIndex.clear();
            zipBasenameIndex.clear();
        }

        function buildZipFileIndex() {
            zipExactIndex.clear();
            zipBasenameIndex.clear();
            if (!book || !book.archive || !book.archive.zip || !book.archive.zip.files) return;

            const keys = Object.keys(book.archive.zip.files);
            for (const key of keys) {
                const norm = key.replace(/^\/+/, '').toLowerCase();
                zipExactIndex.set(norm, key);
                const base = norm.split('/').pop();
                if (base) {
                    if (!zipBasenameIndex.has(base)) zipBasenameIndex.set(base, []);
                    zipBasenameIndex.get(base).push(key);
                }
            }
        }

        function getDirOfPath(p) {
            if (!p) return '';
            const clean = p.replace(/^\/+/, '');
            const idx = clean.lastIndexOf('/');
            return idx >= 0 ? clean.slice(0, idx + 1) : '';
        }

        function resolveZipKeyForChapterAsset(sectionHref, rawAttr) {
            if (!rawAttr || !zipExactIndex.size) return null;
            const trimmed = rawAttr.trim();
            if (!trimmed || /^(https?:|data:|blob:|mailto:|#)/i.test(trimmed)) return null;

            let cleanAttr = trimmed.split('#')[0].split('?')[0];
            try { cleanAttr = decodeURIComponent(cleanAttr); } catch {}

            const opfDir = (book && book.path && book.path.directory)
                ? book.path.directory.replace(/^\/+/, '')
                : '';

            const secNorm = (sectionHref || '').replace(/^\/+/, '');
            const secDir = getDirOfPath(secNorm);
            const candidates = [];

            const pushResolved = (baseDir, rel) => {
                try {
                    const resolved = new URL(rel, 'https://epub.local/' + baseDir).pathname.replace(/^\/+/, '');
                    candidates.push(resolved);
                } catch {}
            };

            pushResolved(secDir, cleanAttr);
            if (opfDir && !secDir.startsWith(opfDir)) {
                pushResolved(opfDir + secDir, cleanAttr);
            }
            if (opfDir) {
                pushResolved(opfDir, cleanAttr);
            }
            candidates.push(cleanAttr.replace(/^\/+/, ''));

            for (const cand of candidates) {
                const hit = zipExactIndex.get(cand.toLowerCase());
                if (hit) return hit;
            }

            const base = cleanAttr.split('/').pop().toLowerCase();
            const matches = zipBasenameIndex.get(base);
            if (matches && matches.length > 0) {
                return matches[0];
            }
            return null;
        }

        function guessMimeType(filename) {
            const lower = (filename || '').toLowerCase();
            if (lower.endsWith('.jpg') || lower.endsWith('.jpeg')) return 'image/jpeg';
            if (lower.endsWith('.png')) return 'image/png';
            if (lower.endsWith('.gif')) return 'image/gif';
            if (lower.endsWith('.webp')) return 'image/webp';
            if (lower.endsWith('.svg')) return 'image/svg+xml';
            return 'application/octet-stream';
        }

        async function getLazyBlobUrl(zipKey) {
            if (!zipKey || !book || !book.archive || !book.archive.zip) return null;
            if (lazyMediaCache.has(zipKey)) return lazyMediaCache.get(zipKey);

            const entry = book.archive.zip.file(zipKey);
            if (!entry) return null;

            try {
                const rawBlob = await entry.async('blob');
                const typedBlob = rawBlob.type ? rawBlob : new Blob([rawBlob], { type: guessMimeType(zipKey) });
                const blobUrl = URL.createObjectURL(typedBlob);
                lazyMediaCache.set(zipKey, blobUrl);
                return blobUrl;
            } catch {
                return null;
            }
        }

        // 僅針對「目前正在觀看的這一章」按需解壓縮圖片與 SVG 封面
        function lazyLoadChapterMedia(contents, token) {
            if (!isTurboLazyMode || !contents || !contents.document || !book || !book.archive || !book.archive.zip) return;

            const docObj = contents.document;
            const sectionHref = (contents.section && (contents.section.canonical || contents.section.href)) || '';
            const tasks = [];

            const imgEls = docObj.querySelectorAll('img[src]');
            imgEls.forEach(img => {
                const rawSrc = img.getAttribute('src');
                const zipKey = resolveZipKeyForChapterAsset(sectionHref, rawSrc);
                if (!zipKey) return;
                tasks.push(
                    getLazyBlobUrl(zipKey).then(blobUrl => {
                        if (blobUrl && token === currentBookToken) {
                            img.setAttribute('src', blobUrl);
                        }
                    })
                );
            });

            const svgImages = docObj.querySelectorAll('image');
            svgImages.forEach(el => {
                const rawHref = el.getAttribute('href') || el.getAttribute('xlink:href') || el.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
                const zipKey = resolveZipKeyForChapterAsset(sectionHref, rawHref);
                if (!zipKey) return;
                tasks.push(
                    getLazyBlobUrl(zipKey).then(blobUrl => {
                        if (blobUrl && token === currentBookToken) {
                            el.setAttribute('href', blobUrl);
                            el.setAttributeNS('http://www.w3.org/1999/xlink', 'href', blobUrl);
                        }
                    })
                );
            });

            if (tasks.length > 0) {
                Promise.all(tasks).then(() => {
                    if (token === currentBookToken) {
                        scheduleEpubResize();
                    }
                }).catch(() => {});
            }
        }

        async function loadTxtContent(text, fileName, detectedEncoding = 'utf-8', keepCurrentPage = false) {

        function recalculateTxtPagination(keepCurrentPage = true) {
            if (state.mode !== 'txt') return;

            const viewerWidth = Math.floor(txtViewer.clientWidth) || window.innerWidth;
            if (state.direction === 'vertical') {
                txtViewer.classList.add('vertical-mode');
                txtContent.style.columnWidth = 'auto';
            } else {
                txtViewer.classList.remove('vertical-mode');
                txtContent.style.columnWidth = `${viewerWidth}px`;
            }

            const totalScrollWidth = txtViewer.scrollWidth;
            const totalPages = Math.max(1, Math.ceil(totalScrollWidth / viewerWidth));
            state.txtTotalPages = totalPages;

            if (!keepCurrentPage) {
                state.txtPage = 0;
            } else if (state.txtPage >= totalPages) {
                state.txtPage = totalPages - 1;
            }

            goToTxtPage(state.txtPage);

        function goToTxtPage(pageIndex) {

            const viewerWidth = Math.floor(txtViewer.clientWidth) || window.innerWidth;

            state.txtPage = clamped;

            if (state.direction === 'vertical') {
                txtViewer.scrollLeft = -(clamped * viewerWidth);
            } else {

            pageInfo.textContent = `目前頁數 ${clamped + 1} / 總頁數 ${state.txtTotalPages}`;

        function restoreTxtHighlightsInDom() {
            if (state.mode !== 'txt') return;
            const list = getBookHighlights().filter(h => h && h.id && h.type === 'txt' && h.text);
            if (list.length === 0) return;

            list.forEach(item => {
                if (txtContent.querySelector(`mark[data-hl-id="${item.id}"]`)) return;
                const walker = document.createTreeWalker(txtContent, NodeFilter.SHOW_TEXT, null);

                        range.setStart(node, idx);
                        range.setEnd(node, idx + item.text.length);

                        mark.dataset.hlId = item.id;

            });
        }

        // === Android 觸控選字捕捉器（解決手機長按選字不觸發 epub.js mouseup 問題） ===
        function captureEpubSelectionFromContents(contents) {
            if (!contents || !contents.window) return;
            try {
                const sel = contents.window.getSelection();
                if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
                const text = sel.toString().replace(/\s+/g, ' ').trim();
                if (!text) return;
                const range = sel.getRangeAt(0);
                const cfi = contents.cfiFromRange(range);
                if (cfi) {
                    selectedCfi = cfi;
                    selectedEpubText = text;
                    updateSelectionIndicator();
                }
            } catch {}
        }

        function captureTxtSelection() {
            if (state.mode !== 'txt') return;
            try {
                const sel = window.getSelection();
                if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
                if (!txtContent.contains(sel.anchorNode) || !txtContent.contains(sel.focusNode)) return;
                const text = sel.toString().replace(/\s+/g, ' ').trim();
                if (!text) return;
                cachedTxtRange = sel.getRangeAt(0).cloneRange();
                cachedTxtText = text;
                updateSelectionIndicator();
            } catch {}
        }

        document.addEventListener('selectionchange', () => {
            if (state.mode === 'txt') {
                captureTxtSelection();
            }
        });

        // === EPUB 引擎（30MB+ 超大檔極速按需解壓模式） ===
        async function loadEpubFromArrayBuffer(buffer, fileName) {
            if (!epubEngineReady || typeof window.ePub === 'undefined') {
                showToast('找不到離線 EPUB 引擎，請確認資料夾內已放入 libs/jszip.min.js 與 libs/epub.min.js。', 5000);
                return;
            }

            currentTxtBuffer = null;
            cleanupEpub();
            const token = currentBookToken;

            state.mode = 'epub';
            state.currentFile = fileName;
            state.epubCfi = null;
            currentEpubByteLength = buffer ? buffer.byteLength : 0;

            const sizeMB = currentEpubByteLength / (1024 * 1024);
            isTurboLazyMode = currentEpubByteLength >= 3 * 1024 * 1024;

            txtViewer.classList.add('hidden');
            epubViewer.classList.remove('hidden');
            pageInfo.textContent = isTurboLazyMode
                ? `極速模式解析目錄中 (${sizeMB.toFixed(1)} MB)...`
                : '正在解析 EPUB 結構...';
            await yieldToUI();

            try {
                book = window.ePub(buffer, {
                    openAs: 'binary',
                    replacements: isTurboLazyMode ? 'none' : 'blobUrl'
                });
                await book.ready;
                if (token !== currentBookToken) return;

                if (isTurboLazyMode) {
                    buildZipFileIndex();
                }

                if (book.package && book.package.metadata) {
                    book.package.metadata.direction = state.direction === 'vertical' ? 'rtl' : 'ltr';
                }

                book.loaded.navigation.then(nav => {
                    if (token !== currentBookToken) return;
                    pendingTocItems = nav && Array.isArray(nav.toc) ? nav.toc : [];
                    if (!sidebarTOC.classList.contains('hidden')) {
                        renderTOC(pendingTocItems);
                        tocRenderedForToken = token;
                    }
                }).catch(() => {
                    if (token !== currentBookToken) return;
                    pendingTocItems = [];
                });

                pageInfo.textContent = '正在顯示頁面...';
                await yieldToUI();

                const saved = await getSavedBookProgress(fileName);
                const startCfi = saved && saved.epubCfi ? saved.epubCfi : null;

                initEpubRendition(startCfi);
                renderBookmarks();
                renderHighlightSummary();

                if (isTurboLazyMode) {
                    showToast(`已極速開啟大型書籍：${fileName} (${sizeMB.toFixed(1)} MB)`);
                } else {
                    showToast(`已載入：${fileName}`);
                }
            } catch {
                if (token !== currentBookToken) return;
                showToast('EPUB 解析失敗，請確認檔案未受損或未受 DRM 保護。');
                pageInfo.textContent = '載入失敗';
            }
        }

        function enforceEpubIframeHeight() {
            if (state.mode !== 'epub') return;
            const viewerHeight = Math.floor(epubViewer.clientHeight) || (window.innerHeight - 130);
            epubViewer.querySelectorAll('iframe').forEach(iframe => {
                if (state.direction === 'vertical') {
                    iframe.style.height = `${viewerHeight}px`;
                    iframe.style.maxHeight = `${viewerHeight}px`;
                }
            });
        }

        function initEpubRendition(startCfi = null) {
            if (!book) return;
            const token = currentBookToken;

            if (!book.spine || !Array.isArray(book.spine.spineItems) || book.spine.spineItems.length === 0) {
                showToast('此 EPUB 檔案缺少有效章節，無法開啟。');
                return;
            }

            if (rendition) {
                try { rendition.destroy(); } catch {}
                rendition = null;
            }
            epubViewer.innerHTML = '';

            const targetDirection = state.direction === 'vertical' ? 'rtl' : 'ltr';
            if (book.package && book.package.metadata) {
                book.package.metadata.direction = targetDirection;
            }

            const viewerWidth = Math.floor(epubViewer.clientWidth) || window.innerWidth;
            const viewerHeight = Math.floor(epubViewer.clientHeight) || (window.innerHeight - 130);

            rendition = book.renderTo('epubViewer', {
                width: viewerWidth,
                height: viewerHeight,
                spread: 'none',
                manager: 'default',
                flow: 'paginated',
                defaultDirection: targetDirection
            });

            rendition.hooks.content.register((contents) => {
                if (isTurboLazyMode) {
                    lazyLoadChapterMedia(contents, token);
                }

                // 綁定 Android / iOS 觸控長按選字監聽（補足 epub.js 僅監聽 mouseup 的不足）
                if (contents && contents.document) {
                    const docObj = contents.document;
                    if (!docObj._einkSelectionBound) {
                        docObj._einkSelectionBound = true;
                        let selTimer = null;
                        const onSelChange = () => {
                            clearTimeout(selTimer);
                            selTimer = setTimeout(() => captureEpubSelectionFromContents(contents), 60);
                        };
                        docObj.addEventListener('selectionchange', onSelChange);
                        docObj.addEventListener('touchend', onSelChange, { passive: true });
                        docObj.addEventListener('mouseup', onSelChange);
                    }
                }

                const result = injectFontsAndStylesToEpubContent(contents);
                if (state.zhConvert !== 'none') {
                    applyZhConvertToEpubContents(contents);
                }
                setTimeout(() => enforceEpubIframeHeight(), 30);
                return result;
            });

            rendition.on('relocated', (location) => {
                if (token !== currentBookToken) return;
                if (location && location.start && location.start.cfi) {
                    state.epubCfi = location.start.cfi;
                }
                enforceEpubIframeHeight();
                updateEpubPagination(location);
            });

            rendition.on('selected', (cfiRange, contents) => {
                selectedCfi = cfiRange;
                try {
                    selectedEpubText = contents && contents.window
                        ? contents.window.getSelection().toString().replace(/\s+/g, ' ').trim()
                        : '';
                } catch {
                    selectedEpubText = '';
                }
                updateSelectionIndicator();
            });

            const displayPromise = startCfi
                ? rendition.display(startCfi).catch(() => rendition.display())
                : rendition.display();

            displayPromise.then(() => {
                if (token !== currentBookToken || !book || !rendition) return;
                enforceEpubIframeHeight();
                restoreEpubHighlights();
                updateEpubPagination();

                const isLargeEpub = isTurboLazyMode || book.spine.spineItems.length > 40;
                if (isLargeEpub) {
                    epubLocationsFailed = true;
                    epubLocations = [];
                    updateEpubPagination();
                    return;
                }

                if (epubLocations.length === 0 && !epubLocationsFailed && book.locations && typeof book.locations.generate === 'function') {
                    setTimeout(() => {
                        if (token !== currentBookToken || !book) return;
                        Promise.resolve()
                            .then(() => book.locations.generate(1600))
                            .then(locations => {
                                if (token !== currentBookToken || !book) return;
                                if (Array.isArray(locations) && locations.length > 0) {
                                    epubLocations = locations;
                                    updateEpubPagination();
                                }
                            })
                            .catch(() => {
                                if (token !== currentBookToken) return;
                                epubLocationsFailed = true;
                                epubLocations = [];
                                updateEpubPagination();
                            });
                    }, 1500);
                }
            }).catch(() => {
                if (token !== currentBookToken) return;
                showToast('EPUB 檔案無法正常顯示，請確認檔案是否完整或未受 DRM 加密。');
            });
        }

        function updateEpubPagination(location) {
            if (!book || !rendition) return;
            let currentLocation = location;
            if (!currentLocation) {
                try {
                    currentLocation = rendition.currentLocation();
                } catch {
                    return;
                }
            }
            if (!currentLocation || !currentLocation.start) return;

            const displayed = currentLocation.start.displayed;
            let overallText = '';

            if (epubLocations.length > 0 && currentLocation.start.cfi) {
                try {
                    let percent = book.locations.percentageFromCfi(currentLocation.start.cfi);
                    if (typeof percent === 'number' && !isNaN(percent)) {
                        percent = Math.min(1, Math.max(0, percent));
                        overallText = `（全書 ${Math.round(percent * 100)}%）`;
                    }
                } catch {}
            } else if (book.spine && Array.isArray(book.spine.spineItems) && book.spine.spineItems.length > 0 && typeof currentLocation.start.index === 'number') {
                const totalChapters = book.spine.spineItems.length;
                const chapterRatio = (displayed && displayed.page && displayed.total)
                    ? (displayed.page / displayed.total)
                    : 0;
                const estPercent = Math.min(1, Math.max(0, (currentLocation.start.index + chapterRatio) / totalChapters));
                overallText = `（全書 ${Math.round(estPercent * 100)}%）`;
            }

            if (displayed && displayed.page && displayed.total) {
                pageInfo.textContent = `目前頁數 ${displayed.page} / 總頁數 ${displayed.total}${overallText}`;
            } else if (overallText) {
                pageInfo.textContent = `閱讀中${overallText}`;
            }
        }

        function scheduleEpubResize() {
            if (state.mode !== 'epub' || !rendition) return;
            clearTimeout(epubResizeTimer);
            epubResizeTimer = setTimeout(() => {
                if (state.mode !== 'epub' || !rendition) return;
                const w = Math.floor(epubViewer.clientWidth) || window.innerWidth;
                const h = Math.floor(epubViewer.clientHeight) || (window.innerHeight - 130);
                try {
                    rendition.resize(w, h);
                    enforceEpubIframeHeight();
                    updateEpubPagination();
                } catch {}
            }, 120);
        }

        // === 目錄 (TOC) 遞迴渲染 ===
        function renderTOC(items) {
            tocList.innerHTML = '';
            if (!items || items.length === 0) {
                tocList.innerHTML = '<li class="muted-text">此書未提供目錄</li>';
                return;
            }

            const fragment = document.createDocumentFragment();

            function appendItems(list, depth = 0) {
                list.forEach(item => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'toc-item-btn';
                    btn.style.paddingLeft = `${8 + depth * 16}px`;
                    btn.textContent = convertChineseText((item.label || '未命名章節').trim(), state.zhConvert);

                    btn.addEventListener('click', () => {
                        if (!rendition || !item.href) return;
                        rendition.display(item.href).then(() => {
                            updateEpubPagination();
                            sidebarTOC.classList.add('hidden');
                        }).catch(() => {
                            const baseHref = item.href.split('#')[0];
                            rendition.display(baseHref).then(() => {
                                updateEpubPagination();
                                sidebarTOC.classList.add('hidden');
                            }).catch(() => {
                                showToast('無法跳轉至此章節。');
                            });
                        });
                    });

                    li.appendChild(btn);
                    fragment.appendChild(li);

                    if (item.subitems && item.subitems.length > 0) {
                        appendItems(item.subitems, depth + 1);
                    }
                });
            }

            appendItems(items, 0);
            tocList.appendChild(fragment);
        }

        // === 樣式與字體同步引擎（精準像素鎖定直排高度，防止文字往下跑） ===
        async function injectFontsAndStylesToEpubContent(contents) {
            if (!contents || !contents.document) return;
            const docObj = contents.document;
            const head = docObj.head || docObj.getElementsByTagName('head')[0];

            if (navigator.onLine && head && !docObj.getElementById('eink-cloud-fonts')) {
                const fontStyle = docObj.createElement('style');
                fontStyle.id = 'eink-cloud-fonts';
                fontStyle.textContent = getCloudFontsCss();
                head.appendChild(fontStyle);
            }

            let customFontFaceCss = '';
            if (state.fontFamily && customFonts.length > 0) {
                const activeCustomFont = customFonts.find(f => state.fontFamily.includes(f.familyName));
                if (activeCustomFont && activeCustomFont.blobUrl) {
                    customFontFaceCss = `
                        @font-face {
                            font-family: '${activeCustomFont.familyName}';
                            src: url('${activeCustomFont.blobUrl}') format('truetype');
                            font-display: swap;
                        }
                    `;
                }
            }

            const bgColor = state.isDarkMode ? '#0E0F17' : 'transparent';
            const textColor = state.isDarkMode ? '#F2F3F9' : '#2B2D40';
            const isVertical = state.direction === 'vertical';
            const writingMode = isVertical ? 'vertical-rl' : 'horizontal-tb';
            const viewerHeight = Math.floor(epubViewer.clientHeight) || (window.innerHeight - 130);
            const fontFamilyRule = state.fontFamily && state.fontFamily !== 'inherit'
                ? `font-family: ${state.fontFamily} !important;`
                : '';

            const verticalFixCss = isVertical ? `
                html {
                    writing-mode: vertical-rl !important;
                    -webkit-writing-mode: vertical-rl !important;
                    column-width: auto !important;
                    -webkit-column-width: auto !important;
                    column-count: auto !important;
                    -webkit-column-count: auto !important;
                    columns: auto !important;
                    column-gap: 0 !important;
                    height: ${viewerHeight}px !important;
                    max-height: ${viewerHeight}px !important;
                    min-height: 0 !important;
                    width: auto !important;
                    overflow-y: hidden !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    box-sizing: border-box !important;
                    vertical-align: top !important;
                }
                body {
                    writing-mode: vertical-rl !important;
                    -webkit-writing-mode: vertical-rl !important;
                    column-width: auto !important;
                    -webkit-column-width: auto !important;
                    column-count: auto !important;
                    -webkit-column-count: auto !important;
                    columns: auto !important;
                    height: ${viewerHeight}px !important;
                    max-height: ${viewerHeight}px !important;
                    min-height: 0 !important;
                    width: auto !important;
                    min-width: 100% !important;
                    overflow-y: hidden !important;
                    margin: 0 !important;
                    padding: 10px 16px !important;
                    box-sizing: border-box !important;
                    vertical-align: top !important;
                    text-align: start !important;
                    text-orientation: mixed !important;
                }
                section, article, div, p, blockquote, ul, ol, li, h1, h2, h3, h4, h5, h6 {
                    margin-top: 0 !important;
                    margin-bottom: 0 !important;
                    padding-top: 0 !important;
                    padding-bottom: 0 !important;
                    max-height: ${Math.max(120, viewerHeight - 20)}px !important;
                    vertical-align: top !important;
                    align-items: flex-start !important;
                    justify-content: flex-start !important;
                }
                p, blockquote, h1, h2, h3, h4, h5, h6 {
                    margin-left: 0.6em !important;
                    margin-right: 0 !important;
                }
            ` : '';

            let overrideStyle = docObj.getElementById('eink-epub-override');
            if (!overrideStyle && head) {
                overrideStyle = docObj.createElement('style');
                overrideStyle.id = 'eink-epub-override';
                head.appendChild(overrideStyle);
            }
            if (overrideStyle) {
                overrideStyle.textContent = `
                    ${customFontFaceCss}
                    html, body {
                        background-color: ${bgColor} !important;
                        color: ${textColor} !important;
                        writing-mode: ${writingMode} !important;
                        -webkit-writing-mode: ${writingMode} !important;
                        ${fontFamilyRule}
                        font-size: ${state.fontSize}px !important;
                        line-height: ${state.lineHeight} !important;
                        letter-spacing: ${state.letterSpacing}px !important;
                        -webkit-user-select: text !important;
                        user-select: text !important;
                    }
                    p, div, span, li, blockquote, h1, h2, h3, h4, h5, h6, a {
                        color: ${textColor} !important;
                        background-color: transparent !important;
                        ${fontFamilyRule}
                        line-height: ${state.lineHeight} !important;
                        letter-spacing: ${state.letterSpacing}px !important;
                        -webkit-user-select: text !important;
                        user-select: text !important;
                    }
                    p, div, span, li, blockquote, h1, h2, h3, h4, h5, h6, a {
                        color: ${textColor} !important;
                        background-color: transparent !important;
                        ${fontFamilyRule}
                        line-height: ${state.lineHeight} !important;
                        -webkit-user-select: text !important;
                        user-select: text !important;
                    }
                    p, div, span, li, blockquote {
                        font-size: ${state.fontSize}px !important;
                    }
                    img, svg {
                        max-width: 100% !important;

                        height: auto !important;
                        object-fit: contain !important;
                    }
                    ${verticalFixCss}
                `;
            }

            if (isVertical) {
                if (docObj.documentElement) {
                    docObj.documentElement.style.setProperty('height', `${viewerHeight}px`, 'important');
                    docObj.documentElement.style.setProperty('max-height', `${viewerHeight}px`, 'important');
                    docObj.documentElement.style.setProperty('overflow-y', 'hidden', 'important');
                }
                if (docObj.body) {
                    docObj.body.style.setProperty('height', `${viewerHeight}px`, 'important');
                    docObj.body.style.setProperty('max-height', `${viewerHeight}px`, 'important');
                    docObj.body.style.setProperty('overflow-y', 'hidden', 'important');

        function applyDarkModeUI() {
            const htmlEl = document.documentElement;
            if (state.isDarkMode) {
                htmlEl.classList.add('dark');
                htmlEl.classList.remove('light');
            } else {
                htmlEl.classList.remove('dark');
                htmlEl.classList.add('light');
            }
            applyBackgroundLayerUI();
        }

        function applyStyles() {
            txtContent.style.fontSize = `${state.fontSize}px`;
            txtContent.style.lineHeight = `${state.lineHeight}`;
            txtContent.style.letterSpacing = `${state.letterSpacing}px`;
            txtContent.style.fontFamily = state.fontFamily;
            txtContent.style.color = state.isDarkMode ? '#F2F3F9' : '#2B2D40';
            txtContent.style.backgroundColor = 'transparent';

            if (state.mode === 'txt') {
                requestAnimationFrame(() => recalculateTxtPagination(true));
            }

            if (state.mode === 'epub' && rendition) {
                const contentsList = rendition.getContents();
                if (Array.isArray(contentsList)) {
                    Promise.all(contentsList.map(c => injectFontsAndStylesToEpubContent(c)))
                        .then(() => {
                            enforceEpubIframeHeight();
                            scheduleEpubResize();
                        })
                        .catch(() => {});
                }
            }
        }

        // === 設定事件 ===
        fontSelect.addEventListener('change', (e) => {
            state.fontFamily = e.target.value;
            applyStyles();
            saveLocalSettings();
        });

        fontInput.addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            const baseName = file.name.replace(/\.(ttf|ttc|otf)$/i, '');
            const uniqueFamily = `CustomFont_${Date.now()}`;

            try {
                const buffer = await file.arrayBuffer();
                const blobUrl = URL.createObjectURL(new Blob([buffer], { type: 'font/ttf' }));
                const face = new FontFace(uniqueFamily, `url(${blobUrl})`);
                await face.load();
                document.fonts.add(face);

                await saveFontToIndexedDB({ familyName: uniqueFamily, displayName: baseName, buffer });
                customFonts.push({ familyName: uniqueFamily, displayName: baseName, blobUrl });

                const option = document.createElement('option');
                option.value = `'${uniqueFamily}', sans-serif`;
                option.textContent = `[自訂] ${baseName}`;
                fontSelect.appendChild(option);
                fontSelect.value = option.value;

                state.fontFamily = option.value;
                applyStyles();
                saveLocalSettings();
                showToast(`已匯入並離線保存字體：${baseName}`);
            } catch {
                showToast('字體載入失敗（部分系統不支援 .ttc 合集字體，建議改用 .ttf 檔案）。');
            }

            fontInput.value = '';
        });

        directionSelect.addEventListener('change', (e) => {
            state.direction = e.target.value;
            saveLocalSettings();

            if (state.mode === 'epub' && book) {
                initEpubRendition(state.epubCfi);
            } else {
                applyStyles();
            }
        });

        txtEncodingSelect.addEventListener('change', async (e) => {
            state.txtEncoding = e.target.value;
            saveLocalSettings();
            if (state.mode === 'txt' && currentTxtBuffer) {
                await loadTxtFromArrayBuffer(currentTxtBuffer, state.currentFile, true);

        zhConvertSelect.addEventListener('change', (e) => {
            state.zhConvert = e.target.value;

            applyCurrentZhConversion();
            const labelMap = {
                none: '原文顯示',
                s2t: '簡體轉繁體',

            };
